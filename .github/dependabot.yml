version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "America/Montevideo"
    labels:
      - dependencies
    # why: supply-chain cooldown — skip freshly published releases until compromised versions are typically detected and unpublished
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "America/Montevideo"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - dependencies
    # why: supply-chain cooldown — skip freshly published releases until compromised versions are typically detected and unpublished
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
    groups:
      framework:
        patterns:
          - "next"
          - "@next/*"
          - "react"
          - "react-dom"
        update-types:
          - "minor"
          - "patch"
      remotion:
        patterns:
          - "remotion"
          - "@remotion/*"
      # oRPC v2 is a pinned beta and its Effect integration targets one Effect
      # major; they move together and never auto-merge (see the auto-merge workflow).
      orpc:
        patterns:
          - "@orpc/*"
          - "effect"
          - "evlog"
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
      ai:
        patterns:
          - "ai"
          - "@ai-sdk/*"
      keystatic:
        patterns:
          - "@keystatic/*"
      ui:
        patterns:
          - "@radix-ui/*"
          - "lucide-react"
          - "class-variance-authority"
          - "clsx"
          - "tailwind-merge"
          - "cmdk"
          - "sonner"
          - "next-themes"
          - "embla-carousel-*"
      forms:
        patterns:
          - "react-hook-form"
          - "@hookform/*"
          - "zod"
      tanstack:
        patterns:
          - "@tanstack/*"
      styling:
        patterns:
          - "tailwindcss"
          - "tailwindcss-animate"
          - "postcss"
          # @tailwindcss/postcss pins tailwindcss exactly, so it has to move in
          # the same PR or the tree ends up with two Tailwind versions.
          - "@tailwindcss/*"
      tooling:
        dependency-type: "development"
        patterns:
          - "oxlint*"
          - "oxfmt"
          - "ultracite"
          - "husky"
          - "lint-staged"
          - "knip"
          - "typescript"
          - "tsx"
          - "cross-env"
          - "@svgr/webpack"
      types:
        patterns:
          - "@types/*"
