name: Create vercel preview URL on pull request
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
jobs:
  build_and_deploy:
    # Only a pull request labelled "preview" gets one (adding the label builds it, each push after
    # rebuilds): every preview is a full build that Vercel keeps, wanted or not
    if: >-
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      - uses: actions/checkout@v7

      # Dependabot pull requests cannot access repository secrets, so they get no
      # preview; the CI workflow validates them instead.
      - uses: amondnet/vercel-action@v42.3.0
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        id: vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
      - name: preview-url
        run: |
          echo ${{ steps.vercel-deploy.outputs.preview-url }}
