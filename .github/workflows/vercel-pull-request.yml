name: Create vercel preview URL on pull request
on:
  pull_request:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
    steps:
      - uses: actions/checkout@v7

      # Dependabot pull requests cannot access repository secrets. Validate
      # their dependency updates locally instead of attempting a deployment
      # that is guaranteed to fail without VERCEL_TOKEN.
      - name: Set up pnpm
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: pnpm/action-setup@v6
        with:
          version: 10.9.0

      - name: Set up Node.js
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: pnpm exec tsc --noEmit

      - uses: amondnet/vercel-action@v42.3.0
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        id: vercel-deploy
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ secrets.ORG_ID }}
          vercel-project-id: ${{ secrets.PROJECT_ID }}
      - name: preview-url
        run: |
          echo ${{ steps.vercel-deploy.outputs.preview-url }}
