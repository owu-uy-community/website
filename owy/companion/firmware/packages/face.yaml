                        on_click:
                          - lvgl.page.show: face_page

script:
  # Expression per state. Called by the face_state select (bridge) and apply_face (voice).
  - id: show_face
    mode: restart
    parameters:
      state: string
    then:
      - lambda: |-
          id(current_face) = state;
      - if:
          condition:
            lambda: return (state == "listening" || state == "followup" || state == "thinking" || state == "speaking") && !id(page_hold);
          then:
            - lvgl.page.show: face_page
      - script.execute: animate_companion

  # Voice pipeline phase (voice.yaml) → face.
  - id: apply_face
    mode: restart
    then:
      - lambda: |-
          std::string face = "idle";
          switch (id(va_phase)) {
            case 2: face = id(follow_up_active) && !id(vad_heard) ? "followup" : "listening"; break;
            case 3: face = "thinking"; break;
            case 4: face = "speaking"; break;
            case 10: face = "offline"; break;
            case 11: face = "error"; break;
            default: face = id(face_sleeping) ? "sleep" : "idle";
          }
          id(show_face).execute(face);

  - id: adjust_volume
    mode: single
    parameters:
      delta: int
    then:
      - number.set:
          id: volume
          value: !lambda |-
            float v = id(volume).state + delta;
            if (v < 0) v = 0;
            if (v > 80) v = 80;
            return v;
      - script.execute: show_volume

  # Volume on the rim: the face stays up, no page switch mid-sentence.
  - id: show_volume
    mode: restart
    then:
      - script.execute: sync_quick_controls
      - lambda: |-
          id(overlay_level) = id(volume).state / 80.0f;
          id(overlay_until) = millis() + 1400;
          char text[16];
          snprintf(text, sizeof(text), "vol %d", int(id(volume).state));
          lv_label_set_text(id(overlay_label), text);

  - id: return_to_face_later
    mode: restart
    then:
      - delay: 12s
      - lvgl.page.show: face_page

  # Idle for 120 s: lids close, z's float for 10 s, then the panel dims and
  # LVGL pauses. Any touch (wake_display) wakes Owy back up.
  - id: fall_asleep
    mode: single
    then:
      - lambda: id(face_sleeping) = true;
      - script.execute: apply_face
      - delay: 10s
      - if:
          condition:
            lambda: return id(face_sleeping) && !id(va).is_running() && !id(turn_pending) && id(va_speaker).is_stopped();
          then:
            - lambda: id(display_dimmed) = true;
            - light.turn_on:
                id: screen_light
                brightness: 15%
            - lvgl.pause:

  - id: pin_press
    mode: queued
    parameters:
      key: string
    then:
      - lambda: |-
          if (key == "C") {
            if (!id(pin_entry).empty()) id(pin_entry).pop_back();
          } else if (key == "OK") {
            if (id(pin_entry) == "${staff_pin}") {
              id(pin_entry) = "";
              id(staff_mode).turn_on();
              id(pin_ok).execute();
            } else {
              id(pin_entry) = "";
              id(pin_bad).execute();
            }
          } else if (id(pin_entry).size() < 8) {
            id(pin_entry) += key;
          }
      - lvgl.label.update:
          id: pin_entry_label
          text: !lambda |-
            if (id(pin_entry).empty()) return std::string("_ _ _ _");
            std::string dots;
            for (size_t i = 0; i < id(pin_entry).size(); ++i) dots += i ? " *" : "*";
            return dots;

  - id: pin_ok
    mode: single
    then:
      - lvgl.slider.update:
          id: volume_slider
          value: !lambda return static_cast<int>(id(volume).state);
      - lvgl.slider.update:
          id: brightness_slider
          value: !lambda return static_cast<int>(id(screen_brightness).state);
      - lvgl.widget.update:
          id: sw_marketplace
          state:
            checked: !lambda return id(marketplace_open).state;
      - lvgl.widget.update:
          id: sw_quiet
          state:
            checked: !lambda return id(quiet_mode).state;
      - lvgl.widget.update:
          id: sw_wake_word
          state:
            checked: !lambda return id(wake_word_enabled).state;
      - lvgl.page.show: settings_page

  - id: pin_bad
    mode: single
    then:
      - lvgl.label.update:
          id: pin_entry_label
          text: "PIN incorrecto"
      - delay: 1200ms
      - lvgl.label.update:
          id: pin_entry_label
          text: "_ _ _ _"

touchscreen:
  - id: !extend touch
    on_touch:
      - script.execute: wake_display
