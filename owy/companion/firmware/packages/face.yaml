# The face (LVGL 9). Brand palette: black, cream 0xFBF5E7, yellow 0xF5BB03,
# blue 0x0162C8. Roles: cream = Owy's body, yellow = Owy talking / primary
# action, blue = you (listening, live mic, "on"). Pages: face / card / qr /
# text / pin / settings (+ quick / calibration / help in companion.yaml).
#
# Expressions are driven by `show_face(state)`; the voice pipeline sets them
# through `apply_face` (voice.yaml) and the bridge through the `face_state`
# select (controls.yaml). companion_model.h owns every animated number and
# FaceRenderer (companion_lvgl.h) is the only writer of animated geometry; it
# scales 466-space by OWY_FACE_SCALE, so only the static widgets below and the
# secondary pages need per-board numbers.

# Geometry for the 466 px panel; a smaller board overrides these in its root.
substitutions:
  screen_px: "466"      # full-screen tap catchers; larger than the panel = page scrollbars
  face_badge_y: "174"   # privacy badge (slashed mic)
  hint_y: "-40"         # face hint / overlay label, from the bottom
  ring_r: "214"         # rim dots radius
  ring_dot: "12"
  small_px: "16"        # Montserrat 600 for captions and tile labels
  title_px: "24"        # Montserrat 700 for the note title
  icon_px: "34"
  page_w: "340"         # card and QR caption labels
  text_w: "360"         # free text body
  note_w: "290"         # the sticky note
  qr_px: "230"          # public grid QR; ≥7 px per module keeps it scannable
  qr_card: "262"
  peek_eye_w: "70"
  peek_eye_h: "74"
  peek_y: "-146"        # QR page: Owy's eyes peeking over the card
  peek_pupil_y: "-10"
  keypad_w: "238"
  keypad_h: "300"
  key_radius: "35"
  keypad_y: "-30"
  pin_label_y: "62"
  settings_w: "300"
  settings_h: "330"

font:
  - file: "../../../public/fonts/organic-stencil.ttf"
    id: font_brand
    size: 32
    bpp: 4
    # ASCII only: the stencil has no accents, ¡ or ¿ — keep stencil copy plain.
    glyphs: "abcdefghijklmnopqrstuvwxyz0123456789.!?,% "
  - file: "../../../public/fonts/organic-stencil.ttf"
    id: font_brand_xl
    size: 72
    bpp: 4
    glyphs: "owy."
  - file: "gfonts://Montserrat"
    id: font_20
    size: 20
    bpp: 4
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Montserrat@600"
    id: font_small
    size: ${small_px}
    bpp: 4
    glyphsets:
      - GF_Latin_Core
    glyphs: ["·", "«", "»"]
  - file: "gfonts://Montserrat@700"
    id: font_title
    size: ${title_px}
    bpp: 4
    glyphsets:
      - GF_Latin_Core
  - file: "gfonts://Montserrat@700"
    id: font_28_bold
    size: 28
    bpp: 4
    glyphsets:
      - GF_Latin_Core
    glyphs: ["·"]
  - file: "gfonts://Montserrat@700"
    id: font_40_bold
    size: 40
    bpp: 4
    glyphsets:
      - GF_Latin_Core
  # Material Symbols Rounded, only the glyphs the pages use (see the codepoints
  # in the comments; names from fonts.google.com/icons).
  - file: "gfonts://Material Symbols Rounded"
    id: font_icons
    size: ${icon_px}
    bpp: 4
    glyphs:
      - "\U0000E31D"  # mic
      - "\U0000E02B"  # mic_off
      - "\U0000E050"  # volume_up
      - "\U0000E518"  # light_mode
      - "\U0000E8AF"  # forum
      - "\U0000E7F5"  # notifications
      - "\U0000E405"  # music_note
      - "\U0000E320"  # laptop_mac
      - "\U0000E32D"  # speaker
      - "\U0000F2D5"  # screen_rotation
      - "\U0000E71C"  # animation
      - "\U0000E3B4"  # center_focus_strong
      - "\U0000E3DC"  # filter_center_focus
      - "\U0000E815"  # sentiment_very_satisfied
      - "\U0000E8FD"  # help
      - "\U0000E00A"  # qr_code_2
      - "\U0000E899"  # lock
      - "\U0000E913"  # touch_app
      - "\U0000E764"  # back_hand
      - "\U0000EB2E"  # swipe_up
      - "\U0000EB52"  # swipe_right
      - "\U0000E5C4"  # arrow_back

globals:
  - id: current_face
    type: std::string
    restore_value: false
    initial_value: '"offline"'
  # A board may pin the current page through a voice turn (a mute unit keeps
  # the reply readable while the follow-up mic is open). Off = classic behavior.
  - id: page_hold
    type: bool
    restore_value: false
    initial_value: "false"
  - id: pin_entry
    type: std::string
    restore_value: false
    initial_value: '""'
  # Idle 120 s: Owy falls asleep on screen for 10 s before the panel dims.
  - id: face_sleeping
    type: bool
    restore_value: false
    initial_value: "false"
  # Volume/brightness on the rim (LEVEL ring) until this time.
  - id: overlay_until
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: overlay_level
    type: float
    restore_value: false
    initial_value: "0"

lvgl:
  id: ui
  displays:
    - amoled
  touchscreens:
    - touch
  buffer_size: 25%
  refresh_interval: 16ms
  color_depth: 16
  bg_color: 0x000000
  bottom_layer:
    bg_color: 0x000000
    bg_opa: COVER
  default_font: font_20
  resume_on_input: true
  on_idle:
    - timeout: 120s
      then:
        - if:
            condition:
              lambda: return !id(va).is_running() && !id(turn_pending) && id(va_speaker).is_stopped() && !id(face_sleeping);
            then:
              - script.execute: fall_asleep

  pages:
    # ── Face ──────────────────────────────────────────────────────────────
    # Draw order matters: brows, eyes, lids above the eyes, mouth, labels, and
    # the full-screen touch owner last. The rim dots are added at boot.
    - id: face_page
      bg_color: 0x000000
      widgets:
        # Brows are 2-point lines so they can tilt (thinking, sad); the
        # renderer moves the points inside a fixed 64×48 box.
        - line:
            id: brow_left
            align: CENTER
            x: -94
            y: -150
            points:
              - 10, 24
              - 54, 24
            line_width: 12
            line_color: 0xF5BB03
            line_rounded: true
        - line:
            id: brow_right
            align: CENTER
            x: 94
            y: -150
            points:
              - 10, 24
              - 54, 24
            line_width: 12
            line_color: 0x0162C8
            line_rounded: true
        - obj:
            id: eye_left
            align: CENTER
            x: -89
            y: -24
            width: 152
            height: 156
            radius: 58
            bg_color: 0xFBF5E7
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - obj:
                  id: pupil_left
                  align: CENTER
                  width: 44
                  height: 54
                  radius: 20
                  bg_color: 0x000000
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  widgets:
                    - obj:
                        id: glint_left
                        align: CENTER
                        x: 9
                        y: -12
                        width: 13
                        height: 13
                        radius: 7
                        bg_color: 0xFBF5E7
                        border_width: 0
              # Happy "∩" eyes: a black disc rising from below.
              - obj:
                  id: happy_left
                  align: CENTER
                  y: 140
                  width: 124
                  height: 124
                  radius: 62
                  bg_color: 0x000000
                  border_width: 0
                  hidden: true
        - obj:
            id: eye_right
            align: CENTER
            x: 89
            y: -24
            width: 152
            height: 156
            radius: 58
            bg_color: 0xFBF5E7
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - obj:
                  id: pupil_right
                  align: CENTER
                  width: 44
                  height: 54
                  radius: 20
                  bg_color: 0x000000
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  widgets:
                    - obj:
                        id: glint_right
                        align: CENTER
                        x: 9
                        y: -12
                        width: 13
                        height: 13
                        radius: 7
                        bg_color: 0xFBF5E7
                        border_width: 0
              - obj:
                  id: happy_right
                  align: CENTER
                  y: 140
                  width: 124
                  height: 124
                  radius: 62
                  bg_color: 0x000000
                  border_width: 0
                  hidden: true
        # Lids: black, drawn over the eyes from the top (sleepy, thinking, sad).
        - obj:
            id: lid_left
            align: CENTER
            x: -89
            y: -102
            width: 156
            height: 4
            radius: 2
            bg_color: 0x000000
            border_width: 0
            hidden: true
        - obj:
            id: lid_right
            align: CENTER
            x: 89
            y: -102
            width: 156
            height: 4
            radius: 2
            bg_color: 0x000000
            border_width: 0
            hidden: true
        # Mouth = lips (cream) + cavity (black) + tongue (yellow) + cut (black,
        # above for the U smile, below for a frown) + bowl (flattens the grin).
        - obj:
            id: mouth
            align: CENTER
            y: 116
            width: 100
            height: 30
            radius: 18
            bg_color: 0xFBF5E7
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - obj:
                  id: mouth_cavity
                  align: CENTER
                  width: 60
                  height: 10
                  radius: 5
                  bg_color: 0x000000
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  hidden: true
                  widgets:
                    - obj:
                        id: mouth_tongue
                        align: CENTER
                        width: 30
                        height: 10
                        radius: 18
                        bg_color: 0xF5BB03
                        border_width: 0
                        hidden: true
              - obj:
                  id: smile_cutout
                  align: CENTER
                  y: -8
                  width: 80
                  height: 26
                  radius: 12
                  bg_color: 0x000000
                  border_width: 0
                  pad_all: 0
              - obj:
                  id: mouth_bowl
                  align: CENTER
                  width: 104
                  height: 8
                  radius: 0
                  bg_color: 0x000000
                  border_width: 0
                  hidden: true
        - obj:
            id: cheek_left
            align: CENTER
            x: -153
            y: 85
            width: 34
            height: 15
            radius: 7
            bg_color: 0xF5BB03
            border_width: 0
            hidden: true
        - obj:
            id: cheek_right
            align: CENTER
            x: 153
            y: 85
            width: 34
            height: 15
            radius: 7
            bg_color: 0x0162C8
            border_width: 0
            hidden: true
        # Asleep: three z's drift up between the brows.
        - label:
            id: zzz_0
            align: CENTER
            text: "z"
            text_font: font_brand
            text_color: 0xFBF5E7
            hidden: true
        - label:
            id: zzz_1
            align: CENTER
            text: "z"
            text_font: font_brand
            text_color: 0xF5BB03
            hidden: true
        - label:
            id: zzz_2
            align: CENTER
            text: "z"
            text_font: font_brand
            text_color: 0xFBF5E7
            hidden: true
        # Non-text microphone glyph, slashed yellow: privacy only (the rim
        # carries listening now). Standby wake-word detection is explained in help.
        - obj:
            id: capture_badge
            align: CENTER
            y: ${face_badge_y}
            width: 36
            height: 40
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            hidden: true
            scrollable: false
            widgets:
              - obj:
                  id: capture_capsule
                  align: TOP_MID
                  y: 2
                  width: 14
                  height: 24
                  radius: 7
                  bg_color: 0xF5BB03
                  border_width: 0
              - obj:
                  align: CENTER
                  y: 10
                  width: 4
                  height: 12
                  bg_color: 0xFBF5E7
                  border_width: 0
              - obj:
                  align: BOTTOM_MID
                  y: -2
                  width: 18
                  height: 4
                  radius: 2
                  bg_color: 0xFBF5E7
                  border_width: 0
              - line:
                  id: privacy_slash
                  points:
                    - 3, 3
                    - 33, 33
                  line_color: 0xF5BB03
                  line_width: 5
        # What a visitor should do (idle hints rotate) or what went wrong.
        - label:
            id: face_hint
            align: BOTTOM_MID
            y: ${hint_y}
            text: "tocame y hablame"
            text_font: font_small
            text_color: 0x8A8A8A
            hidden: true
        # Volume / brightness while the rim shows the level.
        - label:
            id: overlay_label
            align: BOTTOM_MID
            y: ${hint_y}
            text: "vol 80"
            text_font: font_brand
            text_color: 0xF5BB03
            hidden: true
        # Boot: the brand wordmark, then the eyes open.
        - obj:
            id: boot_logo
            align: CENTER
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            radius: 44
            bg_color: 0xFBF5E7
            border_width: 0
            pad_left: 30
            pad_right: 30
            pad_top: 10
            pad_bottom: 16
            scrollable: false
            widgets:
              - label:
                  align: CENTER
                  text: "owy."
                  text_font: font_brand_xl
                  text_color: 0x000000

        # One classifier owns press/move/release. No competing click/swipe
        # callbacks: slow drags and out-and-back pets can never also start talk.
        - obj:
            id: tap_area
            align: CENTER
            width: ${screen_px}
            height: ${screen_px}
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            clickable: true
            scrollable: false
            gesture_bubble: false
            press_lock: true
            on_press:
              - lambda: id(companion).contact.begin(point.x, point.y, millis());
            on_pressing:
              - lambda: |-
                  id(companion).contact.move(point.x, point.y);
                  if (id(companion).contact.hold(millis()) == owy::Gesture::HOLD) {
                    id(last_gesture).publish_state("hold");
                    lv_indev_wait_release(lv_indev_active());
                    id(open_quick_controls).execute();
                  }
            on_release:
              - lambda: |-
                  auto gesture = id(companion).contact.end(point.x, point.y, millis());
                  if (gesture != owy::Gesture::NONE) id(last_gesture).publish_state(owy::gesture_name(gesture));
                  switch (gesture) {
                    case owy::Gesture::TAP: id(tap_to_talk).execute(); break;
                    case owy::Gesture::PET:
                      id(companion).delight(millis());
                      id(play_companion_feedback).execute();
                      break;
                    case owy::Gesture::UP:
                    case owy::Gesture::HOLD: id(open_quick_controls).execute(); break;
                    case owy::Gesture::LEFT: id(open_companion_help).execute(); break;
                    case owy::Gesture::RIGHT: id(open_public_qr).execute(); break;
                    default: break;
                  }
            on_press_lost:
              - lambda: id(companion).contact.cancel();

    # ── Card just filed: the sticky note from the open-space wall ─────────
    - id: card_page
      bg_color: 0x000000
      widgets:
        - obj:
            align: CENTER
            x: -120
            y: -110
            width: 12
            height: 12
            radius: 6
            bg_color: 0x0162C8
            border_width: 0
        - obj:
            align: CENTER
            x: 128
            y: -122
            width: 12
            height: 12
            radius: 6
            bg_color: 0xF5BB03
            border_width: 0
        - obj:
            align: CENTER
            x: -150
            y: 20
            width: 12
            height: 12
            radius: 6
            bg_color: 0xF5BB03
            border_width: 0
        - obj:
            align: CENTER
            x: 152
            y: 40
            width: 12
            height: 12
            radius: 6
            bg_color: 0x0162C8
            border_width: 0
        - obj:
            align: CENTER
            x: 90
            y: 128
            width: 11
            height: 11
            radius: 2
            bg_color: 0xFBF5E7
            border_width: 0
        - label:
            align: TOP_MID
            y: 44
            text: "listo!"
            text_font: font_brand
            text_color: 0xFBF5E7
        - obj:
            id: card_note
            align: CENTER
            y: 6
            width: ${note_w}
            height: SIZE_CONTENT
            radius: 22
            bg_color: 0xF5BB03
            border_width: 0
            pad_all: 16
            scrollable: false
            layout:
              type: flex
              flex_flow: COLUMN
              pad_row: 6
            widgets:
              - label:
                  text: "PROPUESTA · OPEN SPACE"
                  text_font: font_small
                  text_color: 0x5A4500
              - label:
                  id: card_title
                  width: 100%
                  long_mode: WRAP
                  text: ""
                  text_color: 0x000000
                  text_font: font_title
              - label:
                  id: card_speaker
                  width: 100%
                  long_mode: DOT
                  text: ""
                  text_font: font_small
                  text_color: 0x000000
              - label:
                  id: card_where
                  width: 100%
                  text: ""
                  text_color: 0x000000
                  text_font: font_small
        - label:
            align: BOTTOM_MID
            y: -54
            text: "quedó en la grilla"
            text_font: font_small
            text_color: 0xCFC8B8
        - obj:
            align: CENTER
            width: ${screen_px}
            height: ${screen_px}
            bg_opa: TRANSP
            border_width: 0
            clickable: true
            on_click:
              - lvgl.page.show: face_page

    # ── QR to the public grid: Owy peeks over a cream sticker ─────────────
    - id: qr_page
      bg_color: 0x000000
      widgets:
        - obj:
            align: CENTER
            x: -42
            y: ${peek_y}
            width: ${peek_eye_w}
            height: ${peek_eye_h}
            radius: 28
            bg_color: 0xFBF5E7
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - obj:
                  align: CENTER
                  y: ${peek_pupil_y}
                  width: 22
                  height: 26
                  radius: 10
                  bg_color: 0x000000
                  border_width: 0
        - obj:
            align: CENTER
            x: 42
            y: ${peek_y}
            width: ${peek_eye_w}
            height: ${peek_eye_h}
            radius: 28
            bg_color: 0xFBF5E7
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - obj:
                  align: CENTER
                  y: ${peek_pupil_y}
                  width: 22
                  height: 26
                  radius: 10
                  bg_color: 0x000000
                  border_width: 0
        - obj:
            align: CENTER
            y: -6
            width: ${qr_card}
            height: ${qr_card}
            radius: 28
            bg_color: 0xFBF5E7
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              - qrcode:
                  id: grid_qr
                  align: CENTER
                  size: ${qr_px}
                  light_color: 0xFBF5E7
                  dark_color: 0x000000
                  text: "https://owu.uy/conf"
        - label:
            id: qr_caption
            align: BOTTOM_MID
            y: -54
            width: ${page_w}
            text_align: CENTER
            text: "La grilla, en tu celu"
            text_font: font_small
            text_color: 0xF5BB03
        - label:
            align: BOTTOM_MID
            y: -32
            text: "owu.uy/conf"
            text_font: font_small
            text_color: 0x8A8A8A
        - obj:
            align: CENTER
            width: ${screen_px}
            height: ${screen_px}
            bg_opa: TRANSP
            border_width: 0
            clickable: true
            on_click:
              - lvgl.page.show: face_page

    # ── Free text ─────────────────────────────────────────────────────────
    - id: text_page
      bg_color: 0x000000
      widgets:
        - label:
            id: text_body
            align: CENTER
            width: ${text_w}
            long_mode: WRAP
            text_align: CENTER
            text: ""
            text_color: 0xFBF5E7
            text_font: font_28_bold
        - obj:
            align: CENTER
            width: ${screen_px}
            height: ${screen_px}
            bg_opa: TRANSP
            border_width: 0
            clickable: true
            on_click:
              - lvgl.page.show: face_page

    # ── Staff PIN: round keys inside the circle ───────────────────────────
    - id: pin_page
      bg_color: 0x000000
      widgets:
        - label:
            align: TOP_MID
            y: 26
            text: "staff"
            text_font: font_brand
            text_color: 0xF5BB03
        - label:
            id: pin_entry_label
            align: TOP_MID
            y: ${pin_label_y}
            text: "_ _ _ _"
            text_color: 0xFBF5E7
            text_font: font_28_bold
        - buttonmatrix:
            id: pin_keypad
            align: BOTTOM_MID
            y: ${keypad_y}
            width: ${keypad_w}
            height: ${keypad_h}
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            pad_row: 8
            pad_column: 14
            items:
              bg_color: 0x1F1F1F
              text_color: 0xFBF5E7
              text_font: font_28_bold
              radius: ${key_radius}
              shadow_width: 0
              pressed:
                bg_color: 0x0162C8
            rows:
              - buttons:
                  - id: pin_k1
                    text: "1"
                    on_click:
                      - script.execute:
                          id: pin_press
                          key: "1"
                  - id: pin_k2
                    text: "2"
                    on_click:
                      - script.execute:
                          id: pin_press
                          key: "2"
                  - id: pin_k3
                    text: "3"
                    on_click:
                      - script.execute:
                          id: pin_press
                          key: "3"
              - buttons:
                  - id: pin_k4
                    text: "4"
                    on_click:
                      - script.execute:
                          id: pin_press
                          key: "4"
                  - id: pin_k5
                    text: "5"
                    on_click:
                      - script.execute:
                          id: pin_press
                          key: "5"
                  - id: pin_k6
                    text: "6"
                    on_click:
                      - script.execute:
                          id: pin_press
                          key: "6"
              - buttons:
                  - id: pin_k7
                    text: "7"
                    on_click:
                      - script.execute:
                          id: pin_press
                          key: "7"
                  - id: pin_k8
                    text: "8"
                    on_click:
                      - script.execute:
                          id: pin_press
                          key: "8"
                  - id: pin_k9
                    text: "9"
                    on_click:
                      - script.execute:
                          id: pin_press
                          key: "9"
              - buttons:
                  - id: pin_kc
                    text: "C"
                    on_click:
                      - script.execute:
                          id: pin_press
                          key: "C"
                  - id: pin_k0
                    text: "0"
                    on_click:
                      - script.execute:
                          id: pin_press
                          key: "0"
                  - id: pin_kok
                    text: "OK"
                    on_click:
                      - script.execute:
                          id: pin_press
                          key: "OK"
        # Back to ajustes: a small round arrow on the left rim, clear of the keys.
        - button:
            align: LEFT_MID
            x: 14
            y: 30
            width: 44
            height: 44
            radius: 22
            bg_color: 0x1F1F1F
            shadow_width: 0
            widgets:
              - label:
                  align: CENTER
                  text: "\U0000E5C4"
                  text_font: font_icons
