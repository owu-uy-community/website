    # ── Calibrar: a bubble level that really reads the IMU ────────────────
    - id: calibration_page
      bg_color: 0x000000
      widgets:
        - label:
            align: TOP_MID
            y: 30
            text: "calibrar"
            text_font: font_brand
            text_color: 0xF5BB03
        - obj:
            align: CENTER
            y: ${level_y}
            width: ${level_px}
            height: ${level_px}
            radius: 999
            bg_opa: TRANSP
            border_width: 2
            border_color: 0x3A3A3A
        - obj:
            align: CENTER
            y: ${level_y}
            width: ${level_inner}
            height: ${level_inner}
            radius: 999
            bg_opa: TRANSP
            border_width: 2
            border_color: 0x555555
        - obj:
            id: calib_bubble
            align: CENTER
            y: ${level_y}
            width: ${bubble_px}
            height: ${bubble_px}
            radius: 999
            bg_color: 0xF5BB03
            border_width: 0
        - label:
            id: calibration_status
            align: CENTER
            y: ${calib_status_y}
            width: ${help_w}
            text_align: CENTER
            long_mode: WRAP
            text_font: font_small
            text_color: 0xFBF5E7
            text: "Apoyame en una superficie\nestable, mirando al frente.\nLuego tocá Comenzar."
        - bar:
            id: calibration_progress
            align: CENTER
            y: ${calib_bar_y}
            width: ${level_px}
            height: 8
            value: 0
            bg_color: 0x1F1F1F
            indicator:
              bg_color: 0x0162C8
        - button:
            align: BOTTOM_MID
            x: -${calib_btn_x}
            y: -26
            width: ${calib_btn_w}
            height: ${pill_h}
            radius: 22
            bg_color: 0x0162C8
            shadow_width: 0
