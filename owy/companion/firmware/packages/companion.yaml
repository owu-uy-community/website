      bg_color: 0x000000
      widgets:
        - label:
            align: TOP_MID
            y: 38
            text: "hola, soy Owy."
            text_font: font_28_bold
            text_color: 0xF5BB03
        - obj:
            align: CENTER
            width: 324
            height: 276
            bg_opa: TRANSP
            border_width: 0
            pad_all: 8
