        - button:
            align: BOTTOM_MID
            y: -30
            width: 148
            height: 48
            radius: 24
            bg_color: 0xF5BB03
            shadow_width: 0
            widgets:
              - label:
                  align: CENTER
                  text: "volver a Owy"
                  text_color: 0x000000
            on_click:
              - script.execute: companion_home

    - id: calibration_page
      bg_color: 0x000000
      widgets:
        - label:
            align: TOP_MID
            y: 48
            text: "calibrar movimiento"
            text_font: font_28_bold
            text_color: 0xF5BB03
        - label:
            id: calibration_status
            align: CENTER
            y: -46
            width: 330
            text_align: CENTER
            long_mode: WRAP
            text_color: 0xFBF5E7
            text: "Apoyame en una superficie\nestable, mirando al frente.\nLuego tocá Comenzar."
        - bar:
            id: calibration_progress
            align: CENTER
            y: 30
            width: 264
            height: 10
            value: 0
            bg_color: 0x1F1F1F
            indicator:
              bg_color: 0xF5BB03
        - button:
            align: CENTER
            y: 90
            styles: companion_control
            widgets:
              - label:
                  align: CENTER
                  text: "Comenzar / repetir"
            on_click:
              - script.execute: start_motion_calibration
        - button:
            align: BOTTOM_MID
            y: -36
            width: 170
            height: 48
            radius: 24
            bg_color: 0xF5BB03
            shadow_width: 0
            widgets:
              - label:
                  align: CENTER
                  text: "volver / cancelar"
