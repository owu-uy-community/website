# Local personality, deliberate input, quick controls. No new audio owner.
# Board hardware (IMU, PMIC/battery → power_status) lives in packages/boards/*.

# Page geometry for the 466 px panel; a smaller board overrides these in its root.
substitutions:
  tile_w: "136"        # quick-settings tiles, two per row
  tile_h: "112"
  tile_gap: "12"
  tile_radius: "30"
  grid_w: "290"        # 2 × tile_w + tile_gap + a little scroll slack
  quick_h: "236"       # exactly two rows: the knob/finger scrolls a row at a time
  quick_y: "4"
  row_step: "124"      # tile_h + tile_gap
  pill_w: "148"
  pill_h: "44"
  level_px: "150"      # calibration bubble level
  level_inner: "80"
  level_y: "-40"        # bubble level centre
  bubble_px: "30"
  calib_status_y: "76"
  calib_bar_y: "118"
  calib_btn_w: "100"
  calib_btn_x: "54"
  help_w: "340"
  help_h: "290"
  # Speaker chunks reach the ear one DMA queue later (5 × 10 ms) plus the
  # chunk itself: stamp lip shapes that far ahead. Tune by eye on hardware.
  speaker_latency_ms: "60"

globals:
  - id: saved_motion_calibration
    type: std::array<float, 7>
    restore_value: true
    initial_value: '{0, 0, 0, 0, 0, 0, 1}'
  - id: companion
    type: owy::Companion
    restore_value: false
  - id: face_renderer
    type: owy::FaceRenderer
    restore_value: false
  - id: face_ring
    type: owy::FaceRing
    restore_value: false
  # Latest frame: the knob's answer view mirrors it on its mini face.
  - id: face_frame
    type: owy::Frame
    restore_value: false
  - id: display_dimmed
    type: bool
    restore_value: false
    initial_value: "false"
  - id: render_us_sum
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: render_us_max
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: render_count
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: render_max_ms
    type: float
    restore_value: false
    initial_value: "0"

esphome:
  on_boot:
    - priority: -90
      then:
        - script.execute: wake_display
    # After LVGL built the pages: the rim, render timing, the speaker tap and
    # the boot wordmark (the eyes stay shut until it leaves, then open).
    - priority: -100
      then:
        - lambda: |-
            id(face_ring).create(id(face_page)->obj, ${ring_r}, ${ring_dot});
            static uint32_t render_started = 0;
            lv_display_add_event_cb(id(ui).get_disp(), [](lv_event_t *) { render_started = micros(); },
                                    LV_EVENT_RENDER_START, nullptr);
            lv_display_add_event_cb(id(ui).get_disp(), [](lv_event_t *) {
              const uint32_t us = micros() - render_started;
              id(render_us_sum) += us; ++id(render_count);
              if (us > id(render_us_max)) id(render_us_max) = us;
            }, LV_EVENT_RENDER_READY, nullptr);
            // Lips follow the audio actually leaving the speaker (see components/README.md).
            esphome::i2s_audio::I2SAudioSpeakerBase::set_pcm_tap(+[](const uint8_t *data, size_t bytes, uint8_t channels) {
              static owy::SpeechAnalyzer analyzer;
              analyzer.feed(data, bytes, channels, millis() + ${speaker_latency_ms}, id(companion).speech_tap);
            });
            id(companion).wake_at(millis() + 1600);
        - delay: 1400ms
        - lvgl.widget.hide: boot_logo

switch:
  - platform: template
    id: interaction_sounds
    name: Interaction Sounds
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: mic_privacy
    name: Microphone Privacy
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: cancel_turn
      - script.execute: apply_face
    on_turn_off:
      - script.execute: resume_wake_word
  - platform: template
    id: motion_follow
    name: Motion Face
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    id: reduced_motion
    name: Reduced Motion
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: motion_invert_x
    name: Motion Reverse X
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: motion_invert_y
    name: Motion Reverse Y
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

number:
  - platform: template
    id: screen_brightness
    name: Screen Brightness
    icon: mdi:brightness-6
    min_value: 10
    max_value: 100
    step: 5
    initial_value: 80
    optimistic: true
    restore_value: true
    on_value:
      - if:
          condition:
            lambda: return !id(display_dimmed);
          then:
            - light.turn_on:
                id: screen_light
                brightness: !lambda return x / 100.0f;

button:
  - platform: template
    name: Calibrate Motion
    on_press:
      - script.execute: start_motion_calibration
  - platform: template
    name: Cancel Motion Calibration
    on_press:
      - script.execute: open_quick_controls
  - platform: template
    name: Center Motion Face
    on_press:
      - lambda: id(companion).center();
  - platform: template
    name: Smile
    on_press:
      - lambda: id(companion).delight(millis());
  - platform: template
    name: Companion Sound
    entity_category: diagnostic
    on_press:
      - script.execute: play_companion_feedback
  - platform: template
    name: Quick Controls
    on_press:
      - script.execute: open_quick_controls
  - platform: template
    name: Back to Owy
    on_press:
      - script.execute: companion_home

binary_sensor:
  - platform: template
    name: Motion Sensor Ready
    id: motion_sensor_ready
    entity_category: diagnostic
    lambda: return id(companion).motion_ok(millis());

sensor:
  - platform: template
    name: Motion Poll Rate
    entity_category: diagnostic
    unit_of_measurement: Hz
    accuracy_decimals: 1
    update_interval: 5s
    lambda: return id(companion).tracker.cadence.read(millis());
  - platform: template
    name: Motion Maximum Gap
    entity_category: diagnostic
    unit_of_measurement: ms
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(companion).tracker.cadence.take_gap();
  - platform: template
    name: Animation Tick Rate
    entity_category: diagnostic
    unit_of_measurement: Hz
    accuracy_decimals: 1
    update_interval: 5s
    lambda: return id(companion).animation_cadence.read(millis());
  # LVGL render time per refresh (RENDER_START → RENDER_READY on the main loop
  # that also feeds the speaker): mean and worst over the last 5 s.
  - platform: template
    name: Render Time
    id: render_time
    entity_category: diagnostic
    unit_of_measurement: ms
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      const float mean = id(render_count) ? id(render_us_sum) / 1000.0f / id(render_count) : 0;
      id(render_max_ms) = id(render_us_max) / 1000.0f;
      id(render_us_sum) = 0; id(render_count) = 0; id(render_us_max) = 0;
      return mean;
  - platform: template
    name: Render Time Max
    entity_category: diagnostic
    unit_of_measurement: ms
    accuracy_decimals: 1
    update_interval: 5s
    lambda: return id(render_max_ms);
  - platform: wifi_signal
    name: WiFi Signal
    id: companion_wifi
    update_interval: 30s
  - platform: template
    name: Internal Free Memory
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return heap_caps_get_free_size(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);
  - platform: template
    name: Internal Largest Block
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);

text_sensor:
  - platform: template
    name: Saved Motion Calibration
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      const auto &s=id(saved_motion_calibration);
      char text[160];
      snprintf(text,sizeof(text),"v%d bias %.4f %.4f %.4f neutral %.4f %.4f %.4f",int(s[0]),s[1],s[2],s[3],s[4],s[5],s[6]);
      return std::string(text);
  - platform: template
    name: Motion Calibration
    entity_category: diagnostic
    update_interval: 250ms
    lambda: return std::string(id(companion).tracker.calibration_name());
  - platform: template
    id: last_gesture
    name: Last Gesture
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: interface_page
    name: Interface Page
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      auto *page = lv_display_get_screen_active(id(ui).get_disp());
      if (page == id(face_page)->obj) return {"face"};
      if (page == id(quick_page)->obj) return {"controls"};
      if (page == id(help_page)->obj) return {"help"};
      if (page == id(calibration_page)->obj) return {"calibration"};
      if (page == id(pin_page)->obj) return {"pin"};
      if (page == id(settings_page)->obj) return {"staff"};
      if (page == id(qr_page)->obj) return {"qr"};
      if (page == id(card_page)->obj) return {"card"};
      if (page == id(text_page)->obj) return {"text"};
      return {"unknown"};

script:
  - id: wake_display
    mode: restart
    then:
      - lvgl.resume:
      - if:
          condition:
            lambda: return id(display_dimmed) || id(screen_light).current_values.get_brightness() < 0.2f;
          then:
            - light.turn_on:
                id: screen_light
                brightness: !lambda return id(screen_brightness).state / 100.0f;
      - lambda: id(display_dimmed) = false;
      # Asleep: the lids stay shut a beat, then spring open (a stretch).
      - if:
          condition:
            lambda: return id(face_sleeping);
          then:
            - script.stop: fall_asleep
            - lambda: |-
                id(face_sleeping) = false;
                id(companion).wake_at(millis() + 250);
            - script.execute: apply_face

  - id: animate_companion
    mode: single
    then:
      - lambda: |-
          if (id(ui).is_paused()) return;
          const uint32_t now = millis();
          owy::Mood mood = owy::Mood::IDLE;
          const auto &state = id(current_face);
          if (state == "listening") mood = owy::Mood::LISTENING;
          else if (state == "followup") mood = owy::Mood::FOLLOWUP;
          else if (state == "thinking") mood = owy::Mood::THINKING;
          else if (state == "speaking") mood = owy::Mood::SPEAKING;
          else if (state == "happy") mood = owy::Mood::HAPPY;
          else if (state == "offline") mood = owy::Mood::OFFLINE;
          else if (state == "error") mood = owy::Mood::ERROR;
          else if (state == "sleep") mood = owy::Mood::SLEEP;
          if (id(mic_privacy).state) mood = owy::Mood::PRIVACY;
          // Every page shares one frame (the knob's answer view mirrors it).
          auto &frame = id(face_frame);
          frame = id(companion).frame(now, mood, id(motion_follow).state,
              id(reduced_motion).state || id(audio_recovering), id(motion_invert_x).state,
              id(motion_invert_y).state, 0);
          const bool on_face = lv_display_get_screen_active(id(ui).get_disp()) == id(face_page)->obj;
          const bool overlay = int32_t(id(overlay_until) - now) > 0;
          id(face_ring).apply(overlay ? owy::ring_frame(owy::RingMode::LEVEL, now, id(overlay_level), 0, 0)
                                      : id(companion).ring(frame, now),
                              on_face && (overlay || frame.ring != owy::RingMode::NONE));
          if (!on_face) return;
          static int previous_badge = -1;
          const int badge = id(mic_privacy).state;
          if (badge != previous_badge) {
            previous_badge = badge;
            if (badge) lv_obj_remove_flag(id(capture_badge), LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(capture_badge), LV_OBJ_FLAG_HIDDEN);
          }
          static const owy::FaceObjects objects{
              id(eye_left), id(eye_right), id(pupil_left), id(pupil_right), id(glint_left), id(glint_right),
              id(happy_left), id(happy_right), id(lid_left), id(lid_right), id(brow_left)->obj, id(brow_right)->obj,
              id(cheek_left), id(cheek_right), id(mouth), id(mouth_cavity), id(mouth_tongue), id(smile_cutout),
              id(mouth_bowl), {id(zzz_0), id(zzz_1), id(zzz_2)}};
          id(face_renderer).render(frame, objects);

  # What the face says under the mouth: rotating idle hints (attract mode),
  # or what went wrong. Hidden while a turn runs: the rim carries that.
  - id: sync_face_hint
    mode: single
    then:
      - lambda: |-
          if (id(ui).is_paused()) return;
          const uint32_t now = millis();
          const bool on_face = lv_display_get_screen_active(id(ui).get_disp()) == id(face_page)->obj;
          const bool overlay = int32_t(id(overlay_until) - now) > 0;
          const auto &state = id(current_face);
          const char *text = nullptr;
          if (id(mic_privacy).state) text = "micrófono apagado · mantené: ajustes";
          else if (state == "offline") text = "buscando a owy...";
          else if (state == "error") text = "ups, me trabé · probá de nuevo";
          else if (state == "idle" && id(va_phase) == 1 && !id(turn_pending)) {
            const char *hints[] = {id(wake_word_enabled).state ? "decí okay nabu o tocame" : "tocame y hablame",
                                   "¿buscás una charla?", "proponé tu tema"};
            text = hints[(now / 4200) % (id(marketplace_open).state ? 3 : 2)];
          }
          if (text && strcmp(lv_label_get_text(id(face_hint)), text)) lv_label_set_text(id(face_hint), text);
          auto show = [](lv_obj_t *o, bool on) {
            if (lv_obj_has_flag(o, LV_OBJ_FLAG_HIDDEN) != !on) {
              if (on) lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
            }
          };
          show(id(face_hint), on_face && text && !overlay);
          show(id(overlay_label), on_face && overlay);

  - id: open_quick_controls
    mode: restart
    then:
      - script.execute: wake_display
      - script.stop: return_to_face_later
      - lambda: |-
          id(companion).contact.cancel();
          id(companion).tracker.cancel_calibration();
      - script.execute: resume_wake_word
      - lambda: lv_obj_scroll_to_y(id(quick_list), 0, LV_ANIM_OFF);
      - lvgl.page.show: quick_page
      - script.execute: sync_quick_controls

  - id: open_companion_help
    mode: restart
    then:
      - script.execute: wake_display
      - script.stop: return_to_face_later
      - lambda: lv_obj_scroll_to_x(id(help_cards), 0, LV_ANIM_OFF);
      - lvgl.page.show: help_page

  - id: open_public_qr
    mode: restart
    then:
      - script.execute: wake_display
      - lvgl.qrcode.update:
          id: grid_qr
          text: "https://owu.uy/conf"
      - lvgl.label.update:
          id: qr_caption
          text: "La grilla, en tu celu"
      - lvgl.page.show: qr_page
      - script.execute: return_to_face_later

  - id: companion_home
    mode: restart
    then:
      - lambda: |-
          id(companion).contact.cancel();
          id(companion).tracker.cancel_calibration();
      - script.execute: resume_wake_word
      - script.execute: wake_display
      - lvgl.page.show: face_page
      - script.execute: apply_face

  # Tile values, plus blue = on for the toggles.
  - id: sync_quick_controls
    mode: single
    then:
      - lambda: |-
          if (lv_display_get_screen_active(id(ui).get_disp()) != id(quick_page)->obj) return;
          auto tile = [](lv_obj_t *value, const char *text, int on) {
            if (strcmp(lv_label_get_text(value), text) != 0) lv_label_set_text(value, text);
            if (on < 0) return;
            auto *button = lv_obj_get_parent(value);
            const lv_color_t color = lv_color_hex(on ? 0x0162C8 : 0x1F1F1F);
            if (!lv_color_eq(lv_obj_get_style_bg_color(button, LV_PART_MAIN), color))
              lv_obj_set_style_bg_color(button, color, LV_PART_MAIN);
          };
          const bool connected = id(va).get_api_connection() != nullptr;
          std::string status = std::string(connected ? "owy conectado · " : "sin bridge · ") + id(power_status).state;
          if (strcmp(lv_label_get_text(id(quick_power)), status.c_str())) lv_label_set_text(id(quick_power), status.c_str());
          tile(id(quick_mic), id(mic_privacy).state ? "apagado" : "encendido", !id(mic_privacy).state);
          tile(id(quick_continue), id(continuous_conversation).state ? "continua" : "una vez", id(continuous_conversation).state);
          tile(id(quick_chime), id(listening_chime).state ? "al escuchar" : "apagado", id(listening_chime).state);
          tile(id(quick_sounds), id(interaction_sounds).state ? "al jugar" : "apagados", id(interaction_sounds).state);
          tile(id(quick_mic_source), id(mic_source).current_option() == "laptop" ? "laptop" : "dispositivo", -1);
          tile(id(quick_audio_output), id(audio_output).current_option() == "laptop" ? "laptop" : "dispositivo", -1);
          tile(id(quick_motion), !id(companion).motion_ok(millis()) ? "sin sensor" : id(motion_follow).state ? "me sigue" : "quieto",
               id(motion_follow).state && id(companion).motion_ok(millis()));
          tile(id(quick_reduce), id(reduced_motion).state ? "mínimas" : "completas", !id(reduced_motion).state);
          char text[16];
          snprintf(text, sizeof(text), "%d%%", int(id(volume).state));
          tile(id(quick_volume), text, -1);
          snprintf(text, sizeof(text), "%d%%", int(id(screen_brightness).state));
          tile(id(quick_brightness), text, -1);

  - id: start_motion_calibration
    mode: restart
    then:
      - script.execute: cancel_turn
      - script.execute: wake_display
      - script.stop: return_to_face_later
      - micro_wake_word.stop:
      - lambda: |-
          id(companion).contact.cancel();
          id(companion).tracker.begin_calibration(millis());
      - lvgl.page.show: calibration_page

  - id: sync_motion_calibration
    mode: single
    then:
      - lambda: |-
          auto &tracker=id(companion).tracker;
          const bool visible=lv_display_get_screen_active(id(ui).get_disp())==id(calibration_page)->obj;
          if (!visible && tracker.calibrating()) { tracker.cancel_calibration(); id(resume_wake_word).execute(); }
          const bool was_active=tracker.calibrating();
          tracker.tick_calibration(millis());
          using Cal=owy::MotionTracker::Calibration;
          static bool saved=false;
          if (tracker.calibrating()) saved=false;
          if (tracker.calibration==Cal::SUCCESS && !saved) {
            const auto bias=tracker.bias(), neutral=tracker.neutral();
            id(saved_motion_calibration)={1,bias.x,bias.y,bias.z,neutral.x,neutral.y,neutral.z};
            saved=true;
            id(resume_wake_word).execute();
          }
          if (was_active && !tracker.calibrating()) id(resume_wake_word).execute();
          if (!visible) return;
          const char *message=tracker.calibration_message();
          if (strcmp(lv_label_get_text(id(calibration_status)),message)) lv_label_set_text(id(calibration_status),message);
          lv_bar_set_value(id(calibration_progress),tracker.calibration_progress(millis()),LV_ANIM_OFF);
          // The bubble level: the real tilt, so "stay still" is something you can see.
          const auto tilt = tracker.offset();
          const int reach = (${level_px} - ${bubble_px}) / 2;
          lv_obj_set_pos(id(calib_bubble), int(owy::bound(tilt.x * 4 * reach, -reach, reach)),
                         int(owy::bound(-tilt.y * 4 * reach, -reach, reach)) + (${level_y}));

interval:
  - interval: 100ms
    then:
      - script.execute: sync_motion_calibration
  - interval: 16ms
    then:
      - lambda: |-
          // Target ~60Hz idle / ~30Hz voice, not a measured panel FPS claim.
          static bool voice_frame = false;
          voice_frame = !voice_frame;
          if (id(va).is_running() && !voice_frame) return;
          id(animate_companion).execute();
  - interval: 250ms
    then:
      - script.execute: sync_face_hint
  - interval: 1s
    then:
      - script.execute: sync_quick_controls

lvgl:
  style_definitions:
    # Kept as the first style: the emulator's scene export anchors on it.
    - id: companion_control
      width: ${pill_w}
      height: ${pill_h}
      radius: 22
      bg_color: 0x1F1F1F
      text_color: 0xFBF5E7
      shadow_width: 0
      border_width: 0
      pad_all: 8
    - id: companion_tile
      width: ${tile_w}
      height: ${tile_h}
      radius: ${tile_radius}
      bg_color: 0x1F1F1F
      text_color: 0xFBF5E7
      shadow_width: 0
      border_width: 0
      pad_all: 4
  pages:
    # ── Ajustes: big tiles, two per row, scrolled a row at a time ─────────
    - id: quick_page
      bg_color: 0x000000
      widgets:
        - label:
            align: TOP_MID
            y: 26
            text: "ajustes"
            text_font: font_brand
            text_color: 0xF5BB03
        - label:
            id: quick_power
            align: TOP_MID
            y: 66
            text: "energía: sin datos"
            text_font: font_small
            text_color: 0xCFC8B8
        - obj:
            id: quick_list
            align: CENTER
            y: ${quick_y}
            width: ${grid_w}
            height: ${quick_h}
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            scroll_dir: VER
            scroll_snap_y: START
            layout:
              type: flex
              flex_flow: ROW_WRAP
              flex_align_main: SPACE_BETWEEN
              pad_row: ${tile_gap}
              pad_column: ${tile_gap}
            widgets:
              - button:
                  styles: companion_tile
                  layout:
                    type: flex
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_row: 2
                  widgets:
                    - label:
                        text: "\U0000E31D"
                        text_font: font_icons
                        text_color: 0xFBF5E7
                    - label:
                        text: "micrófono"
                        text_font: font_small
                        text_color: 0xFBF5E7
                    - label:
                        id: quick_mic
                        text: "encendido"
                        text_font: font_small
                        text_color: 0xCFC8B8
                  on_click:
                    - switch.toggle: mic_privacy
                    - script.execute: sync_quick_controls
              - button:
                  styles: companion_tile
                  layout:
                    type: flex
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_row: 2
                  widgets:
                    - label:
                        text: "\U0000E050"
                        text_font: font_icons
                        text_color: 0xFBF5E7
                    - label:
                        text: "volumen"
                        text_font: font_small
                        text_color: 0xFBF5E7
                    - label:
                        id: quick_volume
                        text: "80%"
                        text_font: font_small
