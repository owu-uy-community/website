# Local personality, deliberate input, quick controls. The board has no audio
# and no motion sensor: its hardware (panel, touch, knob, haptics) lives in
# packages/boards/*; what Owy says and hears lives on the Mac (the bridge).

# Page geometry for the 466 px panel; the knob overrides these in its root.
substitutions:
  tile_w: "136"        # quick-settings tiles, two per row
  tile_h: "112"
  tile_gap: "12"
  tile_radius: "30"
  grid_w: "290"        # 2 × tile_w + tile_gap + a little scroll slack
  quick_h: "236"       # exactly two rows: the knob/finger scrolls a row at a time
  quick_y: "4"
  row_step: "124"      # tile_h + tile_gap
  pill_w: "148"
  pill_h: "44"
  help_w: "340"
  help_h: "290"

globals:
  - id: companion
    type: owy::Companion
    restore_value: false
  - id: face_renderer
    type: owy::FaceRenderer
    restore_value: false
  - id: face_ring
    type: owy::FaceRing
    restore_value: false
  # Latest frame: the knob's answer view mirrors it on its mini face.
  - id: face_frame
    type: owy::Frame
    restore_value: false
  - id: display_dimmed
    type: bool
    restore_value: false
    initial_value: "false"
  - id: render_us_sum
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: render_us_max
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: render_count
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: render_max_ms
    type: float
    restore_value: false
    initial_value: "0"

esphome:
  on_boot:
    - priority: -90
      then:
        - script.execute: wake_display
    # After LVGL built the pages: the rim, render timing and the boot wordmark
    # (the eyes stay shut until it leaves, then open).
    - priority: -100
      then:
        - lambda: |-
            id(face_ring).create(id(face_page)->obj, ${ring_r}, ${ring_dot});
            static uint32_t render_started = 0;
            lv_display_add_event_cb(id(ui).get_disp(), [](lv_event_t *) { render_started = micros(); },
                                    LV_EVENT_RENDER_START, nullptr);
            lv_display_add_event_cb(id(ui).get_disp(), [](lv_event_t *) {
              const uint32_t us = micros() - render_started;
              id(render_us_sum) += us; ++id(render_count);
              if (us > id(render_us_max)) id(render_us_max) = us;
            }, LV_EVENT_RENDER_READY, nullptr);
            id(companion).wake_at(millis() + 1600);
        - delay: 1400ms
        - lvgl.widget.hide: boot_logo

switch:
  # "Pausa": Owy ignores taps (the bridge sees the switch and stops listening too).
  # The entity keeps its original name: the bridge's registry maps it.
  - platform: template
    id: mic_privacy
    name: Microphone Privacy
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: animate_companion
    on_turn_off:
      - script.execute: animate_companion
  - platform: template
    id: reduced_motion
    name: Reduced Motion
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

number:
  - platform: template
    id: screen_brightness
    name: Screen Brightness
    icon: mdi:brightness-6
    min_value: 10
    max_value: 100
    step: 5
    initial_value: 80
    optimistic: true
    restore_value: true
    on_value:
      - if:
          condition:
            lambda: return !id(display_dimmed);
          then:
            - light.turn_on:
                id: screen_light
                brightness: !lambda return x / 100.0f;

button:
  - platform: template
    name: Smile
    on_press:
      - lambda: id(companion).delight(millis());
  - platform: template
    name: Quick Controls
    on_press:
      - script.execute: open_quick_controls
  - platform: template
    name: Back to Owy
    on_press:
      - script.execute: companion_home

sensor:
  # LVGL render time per refresh (RENDER_START → RENDER_READY): mean and worst over the last 5 s.
  - platform: template
    name: Render Time
    id: render_time
    entity_category: diagnostic
    unit_of_measurement: ms
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      const float mean = id(render_count) ? id(render_us_sum) / 1000.0f / id(render_count) : 0;
      id(render_max_ms) = id(render_us_max) / 1000.0f;
      id(render_us_sum) = 0; id(render_count) = 0; id(render_us_max) = 0;
      return mean;
  - platform: template
    name: Render Time Max
    entity_category: diagnostic
    unit_of_measurement: ms
    accuracy_decimals: 1
    update_interval: 5s
    lambda: return id(render_max_ms);
  - platform: wifi_signal
    name: WiFi Signal
    id: companion_wifi
    update_interval: 30s
  - platform: template
    name: Internal Free Memory
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return heap_caps_get_free_size(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);
  - platform: template
    name: Internal Largest Block
    entity_category: diagnostic
    unit_of_measurement: "B"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL | MALLOC_CAP_8BIT);

text_sensor:
  - platform: template
    id: last_gesture
    name: Last Gesture
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: interface_page
    name: Interface Page
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      auto *page = lv_display_get_screen_active(id(ui).get_disp());
      if (page == id(face_page)->obj) return {"face"};
      if (page == id(quick_page)->obj) return {"controls"};
      if (page == id(help_page)->obj) return {"help"};
      if (page == id(pin_page)->obj) return {"pin"};
      if (page == id(settings_page)->obj) return {"staff"};
      if (page == id(qr_page)->obj) return {"qr"};
      if (page == id(card_page)->obj) return {"card"};
      if (page == id(text_page)->obj) return {"text"};
      return {"unknown"};

script:
  # A tap on the face: the bridge takes it from here (it opens the Mac's mic, or
  # stops what Owy is saying). In pausa a tap opens the settings instead.
  - id: tap_to_talk
    mode: single
    then:
      - if:
          condition:
            lambda: return id(mic_privacy).state;
          then:
            - script.execute: open_quick_controls
          else:
            - script.execute: wake_display
            - lambda: id(tap_count)++;
            - sensor.template.publish:
                id: taps
                state: !lambda return id(tap_count);

  - id: wake_display
    mode: restart
    then:
      - lvgl.resume:
      - if:
          condition:
            lambda: return id(display_dimmed) || id(screen_light).current_values.get_brightness() < 0.2f;
          then:
            - light.turn_on:
                id: screen_light
                brightness: !lambda return id(screen_brightness).state / 100.0f;
      - lambda: id(display_dimmed) = false;
      # Asleep: the lids stay shut a beat, then spring open (a stretch) on the bridge's face.
      - if:
          condition:
            lambda: return id(face_sleeping);
          then:
            - script.stop: fall_asleep
            - lambda: |-
                id(face_sleeping) = false;
                id(companion).wake_at(millis() + 250);
            - script.execute:
                id: show_face
                state: !lambda return std::string(id(face_state).current_option().c_str());

  - id: animate_companion
    mode: single
    then:
      - lambda: |-
          if (id(ui).is_paused()) return;
          const uint32_t now = millis();
          owy::Mood mood = owy::Mood::IDLE;
          const auto &state = id(current_face);
          if (state == "listening") mood = owy::Mood::LISTENING;
          else if (state == "followup") mood = owy::Mood::FOLLOWUP;
          else if (state == "thinking") mood = owy::Mood::THINKING;
          else if (state == "speaking") mood = owy::Mood::SPEAKING;
          else if (state == "happy") mood = owy::Mood::HAPPY;
          else if (state == "offline") mood = owy::Mood::OFFLINE;
          else if (state == "error") mood = owy::Mood::ERROR;
          else if (state == "sleep") mood = owy::Mood::SLEEP;
          else if (state == "record") mood = owy::Mood::RECORD;
          else if (state == "invite") mood = owy::Mood::INVITE;
          if (id(mic_privacy).state) mood = owy::Mood::PRIVACY;
          // Every page shares one frame (the knob's answer view mirrors it).
          auto &frame = id(face_frame);
          frame = id(companion).frame(now, mood, id(reduced_motion).state, 0);
          const bool on_face = lv_display_get_screen_active(id(ui).get_disp()) == id(face_page)->obj;
          const bool overlay = int32_t(id(overlay_until) - now) > 0;
          id(face_ring).apply(overlay ? owy::ring_frame(owy::RingMode::LEVEL, now, id(overlay_level), 0, 0)
                                      : id(companion).ring(frame, now),
                              on_face && (overlay || frame.ring != owy::RingMode::NONE));
          if (!on_face) return;
          static int previous_badge = -1;
          const int badge = id(mic_privacy).state;
          if (badge != previous_badge) {
            previous_badge = badge;
            if (badge) lv_obj_remove_flag(id(capture_badge), LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(capture_badge), LV_OBJ_FLAG_HIDDEN);
          }
          static const owy::FaceObjects objects{
              id(eye_left), id(eye_right), id(pupil_left), id(pupil_right), id(glint_left), id(glint_right),
              id(happy_left), id(happy_right), id(lid_left), id(lid_right), id(brow_left)->obj, id(brow_right)->obj,
              id(cheek_left), id(cheek_right), id(mouth), id(mouth_cavity), id(mouth_tongue), id(smile_cutout),
              id(mouth_bowl), {id(zzz_0), id(zzz_1), id(zzz_2)}};
          id(face_renderer).render(frame, objects);

  # What the face says under the mouth: rotating idle hints (attract mode),
  # or what went wrong. Hidden while a turn runs: the rim carries that.
  - id: sync_face_hint
    mode: single
    then:
      - lambda: |-
          if (id(ui).is_paused()) return;
          const uint32_t now = millis();
          const bool on_face = lv_display_get_screen_active(id(ui).get_disp()) == id(face_page)->obj;
          const bool overlay = int32_t(id(overlay_until) - now) > 0;
          const auto &state = id(current_face);
          const char *text = nullptr;
          if (id(mic_privacy).state) text = "en pausa · mantené: ajustes";
          else if (state == "offline") text = "buscando a owy...";
          else if (state == "error") text = "ups, me trabé · tocá para probar de nuevo";
          else if (state == "idle") {
            const char *hints[] = {"tocame y hablame", "¿buscás una charla?", "proponé tu tema"};
            text = hints[(now / 4200) % 3];
          }
          if (text && strcmp(lv_label_get_text(id(face_hint)), text)) lv_label_set_text(id(face_hint), text);
          auto show = [](lv_obj_t *o, bool on) {
            if (lv_obj_has_flag(o, LV_OBJ_FLAG_HIDDEN) != !on) {
              if (on) lv_obj_remove_flag(o, LV_OBJ_FLAG_HIDDEN); else lv_obj_add_flag(o, LV_OBJ_FLAG_HIDDEN);
            }
          };
          show(id(face_hint), on_face && text && !overlay);
          show(id(overlay_label), on_face && overlay);

  - id: open_quick_controls
    mode: restart
    then:
      - script.execute: wake_display
      - script.stop: return_to_face_later
      - lambda: |-
          id(companion).contact.cancel();
          lv_obj_scroll_to_y(id(quick_list), 0, LV_ANIM_OFF);
      - lvgl.page.show: quick_page
      - script.execute: sync_quick_controls

  - id: open_companion_help
    mode: restart
    then:
      - script.execute: wake_display
      - script.stop: return_to_face_later
      - lambda: lv_obj_scroll_to_x(id(help_cards), 0, LV_ANIM_OFF);
      - lvgl.page.show: help_page

  - id: open_public_qr
    mode: restart
    then:
      - script.execute: wake_display
      - lvgl.qrcode.update:
          id: grid_qr
          text: "https://owu.uy/conf"
      - lvgl.label.update:
          id: qr_caption
          text: "La grilla, en tu celu"
      - lvgl.page.show: qr_page
      - script.execute: return_to_face_later

  - id: companion_home
    mode: restart
    then:
      - lambda: id(companion).contact.cancel();
      - script.execute: wake_display
      - lvgl.page.show: face_page
      - script.execute: animate_companion

  # Tile values, plus blue = on for the toggles.
  - id: sync_quick_controls
    mode: single
    then:
      - lambda: |-
          if (lv_display_get_screen_active(id(ui).get_disp()) != id(quick_page)->obj) return;
          auto tile = [](lv_obj_t *value, const char *text, int on) {
            if (strcmp(lv_label_get_text(value), text) != 0) lv_label_set_text(value, text);
            if (on < 0) return;
            auto *button = lv_obj_get_parent(value);
            const lv_color_t color = lv_color_hex(on ? 0x0162C8 : 0x1F1F1F);
            if (!lv_color_eq(lv_obj_get_style_bg_color(button, LV_PART_MAIN), color))
              lv_obj_set_style_bg_color(button, color, LV_PART_MAIN);
          };
          const bool connected = !(id(face_state).current_option() == "offline");
          std::string status = std::string(connected ? "owy conectado · " : "sin bridge · ") + id(power_status).state;
          if (strcmp(lv_label_get_text(id(quick_power)), status.c_str())) lv_label_set_text(id(quick_power), status.c_str());
          tile(id(quick_mic), id(mic_privacy).state ? "en pausa" : "activo", !id(mic_privacy).state);
          tile(id(quick_reduce), id(reduced_motion).state ? "mínimas" : "completas", !id(reduced_motion).state);
          char text[16];
          snprintf(text, sizeof(text), "%d%%", int(id(screen_brightness).state));
          tile(id(quick_brightness), text, -1);

interval:
  - interval: 16ms
    then:
      - script.execute: animate_companion
  - interval: 250ms
    then:
      - script.execute: sync_face_hint
  - interval: 1s
    then:
      - script.execute: sync_quick_controls

lvgl:
  style_definitions:
    # Kept as the first style: the emulator's scene export anchors on it.
    - id: companion_control
      width: ${pill_w}
      height: ${pill_h}
      radius: 22
      bg_color: 0x1F1F1F
      text_color: 0xFBF5E7
      shadow_width: 0
      border_width: 0
      pad_all: 8
    - id: companion_tile
      width: ${tile_w}
      height: ${tile_h}
      radius: ${tile_radius}
      bg_color: 0x1F1F1F
      text_color: 0xFBF5E7
      shadow_width: 0
      border_width: 0
      pad_all: 4
  pages:
    # ── Ajustes: big tiles, two per row, scrolled a row at a time ─────────
    - id: quick_page
      bg_color: 0x000000
      widgets:
        - label:
            align: TOP_MID
            y: 26
            text: "ajustes"
            text_font: font_brand
            text_color: 0xF5BB03
        - label:
            id: quick_power
            align: TOP_MID
            y: 66
            text: "energía: sin datos"
            text_font: font_small
            text_color: 0xCFC8B8
        - obj:
            id: quick_list
            align: CENTER
            y: ${quick_y}
            width: ${grid_w}
            height: ${quick_h}
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            scroll_dir: VER
            scroll_snap_y: START
            layout:
              type: flex
              flex_flow: ROW_WRAP
              flex_align_main: SPACE_BETWEEN
              pad_row: ${tile_gap}
              pad_column: ${tile_gap}
            widgets:
              - button:
                  styles: companion_tile
                  layout:
                    type: flex
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_row: 2
                  widgets:
                    - label:
                        text: "\U0000E31D"
                        text_font: font_icons
                        text_color: 0xFBF5E7
                    - label:
                        text: "owy"
                        text_font: font_small
                        text_color: 0xFBF5E7
                    - label:
                        id: quick_mic
                        text: "activo"
                        text_font: font_small
                        text_color: 0xCFC8B8
                  on_click:
                    - switch.toggle: mic_privacy
                    - script.execute: sync_quick_controls
              - button:
                  styles: companion_tile
                  layout:
                    type: flex
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_row: 2
                  widgets:
                    - label:
                        text: "\U0000E518"
                        text_font: font_icons
                        text_color: 0xFBF5E7
                    - label:
                        text: "brillo"
                        text_font: font_small
                        text_color: 0xFBF5E7
                    - label:
                        id: quick_brightness
                        text: "80%"
                        text_font: font_small
                        text_color: 0xCFC8B8
                  on_click:
                    - number.set:
                        id: screen_brightness
                        value: !lambda |-
                          const float v = id(screen_brightness).state;
                          return v < 45 ? 55 : v < 70 ? 80 : v < 95 ? 100 : 30;
                    - script.execute: sync_quick_controls
              - button:
                  styles: companion_tile
                  layout:
                    type: flex
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_row: 2
                  widgets:
                    - label:
                        text: "\U0000E71C"
                        text_font: font_icons
                        text_color: 0xFBF5E7
                    - label:
                        text: "animaciones"
                        text_font: font_small
                        text_color: 0xFBF5E7
                    - label:
                        id: quick_reduce
                        text: "completas"
                        text_font: font_small
                        text_color: 0xCFC8B8
                  on_click:
                    - switch.toggle: reduced_motion
                    - script.execute: sync_quick_controls
              - button:
                  styles: companion_tile
                  layout:
                    type: flex
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_row: 2
                  widgets:
                    - label:
                        text: "\U0000E815"
                        text_font: font_icons
                        text_color: 0xFBF5E7
                    - label:
                        text: "sonreí"
                        text_font: font_small
                        text_color: 0xFBF5E7
                    - label:
                        text: "probá"
                        text_font: font_small
                        text_color: 0xCFC8B8
                  on_click:
                    - lambda: id(companion).delight(millis());
                    - script.execute: companion_home
              - button:
                  styles: companion_tile
                  layout:
                    type: flex
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_row: 2
                  widgets:
                    - label:
                        text: "\U0000E8FD"
                        text_font: font_icons
                        text_color: 0xFBF5E7
                    - label:
                        text: "cómo jugar"
                        text_font: font_small
                        text_color: 0xFBF5E7
                    - label:
                        text: "gestos"
                        text_font: font_small
                        text_color: 0xCFC8B8
                  on_click:
                    - script.execute: open_companion_help
              - button:
                  styles: companion_tile
                  layout:
                    type: flex
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_row: 2
                  widgets:
                    - label:
                        text: "\U0000E00A"
                        text_font: font_icons
                        text_color: 0xFBF5E7
                    - label:
                        text: "grilla"
                        text_font: font_small
                        text_color: 0xFBF5E7
                    - label:
                        text: "QR"
                        text_font: font_small
                        text_color: 0xCFC8B8
                  on_click:
                    - script.execute: open_public_qr
              - button:
                  styles: companion_tile
                  layout:
                    type: flex
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_row: 2
                  widgets:
                    - label:
                        text: "\U0000E899"
                        text_font: font_icons
                        text_color: 0xFBF5E7
                    - label:
                        text: "staff"
                        text_font: font_small
                        text_color: 0xFBF5E7
                    - label:
                        text: "PIN"
                        text_font: font_small
                        text_color: 0xCFC8B8
                  on_click:
                    - lvgl.page.show: pin_page
        - button:
            align: BOTTOM_MID
            y: -24
            width: ${pill_w}
            height: ${pill_h}
            radius: 22
            bg_color: 0xF5BB03
            shadow_width: 0
            widgets:
              - label:
                  align: CENTER
                  text: "volver a Owy"
                  text_font: font_small
                  text_color: 0x000000
            on_click:
              - script.execute: companion_home

    # ── Cómo jugar: one gesture per card, swipe sideways ──────────────────
    - id: help_page
      bg_color: 0x000000
      widgets:
        - obj:
            id: help_cards
            align: CENTER
            y: -14
            width: ${help_w}
            height: ${help_h}
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollbar_mode: "OFF"
            scroll_dir: HOR
            scroll_snap_x: CENTER
            layout:
              type: flex
              flex_flow: ROW
              pad_column: 0
            widgets:
              - obj:
                  width: ${help_w}
                  height: 100%
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_row: 10
                  widgets:
                    - label:
                        text: "\U0000E913"
                        text_font: font_icons
                        text_color: 0xF5BB03
                    - label:
                        text: "tocame"
                        text_font: font_brand
                        text_color: 0xFBF5E7
                    - label:
                        text: "y hablame. Si estoy hablando,\notro toque me frena."
                        text_align: CENTER
                        text_font: font_small
                        text_color: 0xCFC8B8
                    - label:
                        text: "1 / 4"
                        text_font: font_small
                        text_color: 0x5D5A52
              - obj:
                  width: ${help_w}
                  height: 100%
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: COLUMN
                    flex_align_main: CENTER
                    flex_align_cross: CENTER
                    flex_align_track: CENTER
                    pad_row: 10
                  widgets:
                    - label:
                        text: "\U0000E764"
                        text_font: font_icons
                        text_color: 0xF5BB03
                    - label:
                        text: "acariciame"
                        text_font: font_brand
                        text_color: 0xFBF5E7
                    - label:
                        text: "pasá el dedo de lado a lado\ny me pongo contento."
                        text_align: CENTER
                        text_font: font_small
                        text_color: 0xCFC8B8
                    - label:
                        text: "2 / 4"
                        text_font: font_small
                        text_color: 0x5D5A52
