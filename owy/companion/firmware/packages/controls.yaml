# What the bridge drives over the native API — the whole contract, both ways
# (companion/bridge/src/device/esphome.ts). Object ids derive from the names.
#
#   select  face_state  (bridge → board)  idle · listening · thinking · speaking · happy · error · offline
#   sensor  taps        (board → bridge)  a count: +1 per tap on the face while not in pausa
#   switch  staff_mode (PIN page, 10 min) · microphone_privacy "pausa" · reduced_motion   (companion.yaml)
#   number  screen_brightness                                                          (companion.yaml)
#   actions show_card · show_qr · show_text · express · mouth_track · mic_level
#           show_caption · show_heard (the knob's answer view: boards/knob18.yaml)
#
# The board neither hears nor speaks. The bridge sets the face for every step of a
# turn, streams the Mac mic's level while Owy listens (the halo) and the lip track
# while Owy talks (the mouth), and the captions.

globals:
  - id: tap_count
    type: uint32_t
    restore_value: false
    initial_value: "0"

select:
  - platform: template
    id: face_state
    name: Face State
    options:
      - idle
      - listening
      - thinking
      - speaking
      - happy
      - error
      - offline
    initial_option: offline
    optimistic: true
    restore_value: false
    on_value:
      # listening → thinking: a quick nod, "te entendí".
      - lambda: |-
          static std::string previous;
          if (previous == "listening" && x == "thinking") id(companion).nod(millis());
          previous = x;
      - script.execute:
          id: show_face
          state: !lambda return x;

sensor:
  - platform: template
    id: taps
    name: Taps
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never

switch:
  # Unlocked from the PIN page; auto-expires so a forgotten kiosk is never staff.
  - platform: template
    id: staff_mode
    name: Staff Mode
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lvgl.label.update:
          id: settings_staff_status
          text: "Modo staff: ON (10 min)"
      - delay: 10min
      - switch.turn_off: staff_mode
    on_turn_off:
      - lvgl.label.update:
          id: settings_staff_status
          text: "Modo staff: OFF"
      - if:
          condition:
            lambda: return lv_display_get_screen_active(id(ui).get_disp()) == id(settings_page)->obj;
          then:
            - script.execute: open_quick_controls

button:
  # Same as a tap on the face (the bridge's probe and the knob's web page use it).
  - platform: template
    id: talk_button
    name: Hablar
    on_press:
      - script.execute: tap_to_talk
  - platform: restart
    id: restart_button
    name: Reiniciar

api:
  actions:
    - action: show_card
      # Variable names must not shadow component namespaces (speaker, text…).
      variables:
        title: string
        presenter: string
        room: string
        time_slot: string
      then:
        - lvgl.label.update:
            id: card_title
            text: !lambda return title;
        - lvgl.label.update:
            id: card_speaker
            text: !lambda return presenter;
        - lvgl.label.update:
            id: card_where
            text: !lambda return room + "  ·  " + time_slot;
        - lvgl.page.show: card_page
        - script.execute: return_to_face_later

    - action: show_qr
      variables:
        url: string
        caption: string
      then:
        - lvgl.qrcode.update:
            id: grid_qr
            text: !lambda return url;
        - lvgl.label.update:
            id: qr_caption
            text: !lambda |-
              if (caption.empty()) return std::string("La grilla, en tu celu");
              return caption;
        - lvgl.page.show: qr_page
        - script.execute: return_to_face_later

    - action: show_text
      variables:
        body: string
      then:
        - lvgl.label.update:
            id: text_body
            text: !lambda return body;
        - lvgl.page.show: text_page
        - script.execute: return_to_face_later

    # Lip shapes for what Owy says (it plays on the Mac). See Companion::mouth_track.
    - action: mouth_track
      variables:
        frames: string
        lead_ms: int
      then:
        - lambda: id(companion).mouth_track(frames.c_str(), frames.size(), millis(), lead_ms);

    # What Owy feels while saying a sentence (or reacting while it thinks): one of
    # owy::EXPRESSION_NAMES, applied `lead_ms` from now when that line becomes
    # audible, at `strength` 0..100. The voice state stays truthful; this only
    # layers eyes/brows/cheeks over it. Unknown names are ignored.
    - action: express
      variables:
        feeling: string
        lead_ms: int
        strength: int
      then:
        - lambda: |-
            owy::Expression e;
            if (owy::expression_from_name(feeling.c_str(), feeling.size(), e))
              id(companion).express(e, millis() + uint32_t(int32_t(lead_ms)), strength / 100.0f);

    # The Mac mic's level (0..100) while Owy listens: the halo and the eyes follow it.
    - action: mic_level
      variables:
        level: int
      then:
        - lambda: id(companion).level(level / 100.0f, millis());
