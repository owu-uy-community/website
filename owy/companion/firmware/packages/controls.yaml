# Entities and actions the bridge drives over the native API.
#
# Object ids (derived from the names) are part of the bridge contract
# (companion/bridge/src/device/esphome.ts):
#   select  face_state · switch staff_mode / marketplace_open / quiet_mode / wake_word_enabled
#   number  volume · actions show_card / show_qr / show_text / set_volume / mouth_track / express
#
# The mouth follows the audio this device plays (speaker PCM tap); when the
# bridge plays a turn on the laptop instead, it sends `mouth_track` frames.

select:
  - platform: template
    id: face_state
    name: Face State
    options:
      - idle
      - listening
      - thinking
      - speaking
      - happy
      - error
      - offline
    initial_option: offline
    optimistic: true
    restore_value: false
    on_value:
      # A model's decorative expression must not hide active capture/playback.
      - if:
          condition:
            lambda: return id(va).is_running() || id(turn_pending) || id(audio_recovering);
          then:
            - script.execute: apply_face
          else:
            - script.execute:
                id: show_face
                state: !lambda return x;

  # Audio routing, read by the bridge at the start of every turn. `laptop` =
  # the machine running the bridge captures/plays through its own audio
  # devices (a stage mic + the room PA) while this device keeps the trigger,
  # the face and the captions. Persisted; the bridge falls back to
  # COMPANION_MIC_SOURCE / COMPANION_AUDIO_OUTPUT when a board lacks them.
  - platform: template
    id: mic_source
    name: Mic Source
    options:
      - dispositivo
      - laptop
    initial_option: dispositivo
    optimistic: true
    restore_value: true
  - platform: template
    id: audio_output
    name: Audio Output
    options:
      - dispositivo
      - laptop
    initial_option: dispositivo
    optimistic: true
    restore_value: true

switch:
  # Unlocked from the PIN page; auto-expires so a forgotten kiosk is never staff.
  - platform: template
    id: staff_mode
    name: Staff Mode
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - lvgl.label.update:
          id: settings_staff_status
          text: "Modo staff: ON (10 min)"
      - delay: 10min
      - switch.turn_off: staff_mode
    on_turn_off:
      - lvgl.label.update:
          id: settings_staff_status
          text: "Modo staff: OFF"
      - if:
          condition:
            lambda: return lv_display_get_screen_active(id(ui).get_disp()) == id(settings_page)->obj;
          then:
            - script.execute: open_quick_controls

  # Attendees can only file proposals while this is on (the marketplace slot).
  - platform: template
    id: marketplace_open
    name: Marketplace Open
    optimistic: true
    restore_mode: ALWAYS_OFF

  # No ambient announcements (talks block, after party).
  - platform: template
    id: quiet_mode
    name: Quiet Mode
    optimistic: true
    restore_mode: ALWAYS_OFF

  - platform: template
    id: wake_word_enabled
    name: Wake Word
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: resume_wake_word
    on_turn_off:
      - micro_wake_word.stop:
      - script.execute: apply_face

  - platform: template
    id: continuous_conversation
    name: Continuous Conversation
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_off:
      - if:
          condition:
            lambda: return id(follow_up_active) && id(va_phase) != 4;
          then:
            - script.execute: cancel_turn

  - platform: template
    id: listening_chime
    name: Listening Chime
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

number:
  - platform: template
    id: volume
    name: Volumen
    min_value: 0
    # Hard ceiling: the NS4150B amp saturates above ~80, so cap it there.
    max_value: 80
    step: 5
    initial_value: 80
    optimistic: true
    restore_value: true
    on_value:
      - speaker.volume_set:
          id: va_speaker
          volume: !lambda return x / 100.0f;

button:
  - platform: template
    id: talk_button
    name: Hablar
    on_press:
      - script.execute: tap_to_talk
  - platform: template
    id: test_tone
    name: Tono de prueba
    on_press:
      - script.execute: play_test_tone
  - platform: restart
    id: restart_button
    name: Reiniciar

api:
  actions:
    - action: show_card
      # Variable names must not shadow component namespaces (speaker, text…).
      variables:
        title: string
        presenter: string
        room: string
        time_slot: string
      then:
        - lvgl.label.update:
            id: card_title
            text: !lambda return title;
        - lvgl.label.update:
            id: card_speaker
            text: !lambda return presenter;
        - lvgl.label.update:
            id: card_where
            text: !lambda return room + "  ·  " + time_slot;
        - lvgl.page.show: card_page
        - script.execute: return_to_face_later

    - action: show_qr
      variables:
        url: string
        caption: string
      then:
        - lvgl.qrcode.update:
            id: grid_qr
            text: !lambda return url;
        - lvgl.label.update:
            id: qr_caption
            text: !lambda |-
              if (caption.empty()) return std::string("La grilla, en tu celu");
              return caption;
        - lvgl.page.show: qr_page
        - script.execute: return_to_face_later

    - action: set_volume
      variables:
        level: int
      then:
        - number.set:
            id: volume
            value: !lambda return level;
        - script.execute: show_volume

    # Lip shapes for audio played elsewhere (laptop output). See Companion::mouth_track.
    - action: mouth_track
      variables:
        frames: string
        lead_ms: int
      then:
        - lambda: id(companion).mouth_track(frames.c_str(), frames.size(), millis(), lead_ms);

    # What Owy feels while saying a sentence (or reacting while it thinks): one of
    # owy::EXPRESSION_NAMES, applied `lead_ms` from now when that line becomes
    # audible, at `strength` 0..100. The voice state stays truthful; this only
    # layers eyes/brows/cheeks over it. Unknown names are ignored.
    - action: express
      variables:
        feeling: string
        lead_ms: int
        strength: int
      then:
        - lambda: |-
            owy::Expression e;
            if (owy::expression_from_name(feeling.c_str(), feeling.size(), e))
              id(companion).express(e, millis() + uint32_t(int32_t(lead_ms)), strength / 100.0f);

    - action: show_text
      variables:
        body: string
      then:
        - lvgl.label.update:
            id: text_body
            text: !lambda return body;
        - lvgl.page.show: text_page
        - script.execute: return_to_face_later
