                  id: mini_cheek_r
                  align: CENTER
                  x: 32
                  y: 18
                  width: 7
                  height: 3
                  radius: 1
                  bg_color: 0x0162C8
                  border_width: 0
                  hidden: true
        # What Owy understood (STT_END text): mis-hearings become visible on a mute unit.
        - label:
            id: caption_heard
            align: TOP_MID
            y: 112
            width: 240
            long_mode: DOT
            text_align: CENTER
            text: ""
            text_font: font_small
            text_color: 0xBDB6A6
            bg_color: 0x1F1F1F
            bg_opa: COVER
            radius: 14
            pad_top: 6
            pad_bottom: 6
            pad_left: 12
            pad_right: 12
            clickable: false
        - obj:
            id: caption_box
            align: CENTER
            y: 50
            width: 262
            height: 160
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
            widgets:
              - label:
                  id: caption_body
                  align: BOTTOM_MID
                  width: 262
                  long_mode: WRAP
                  text_align: CENTER
                  text: ""
                  text_color: 0xFBF5E7
        - obj:
            align: CENTER
            width: ${screen_px}
            height: ${screen_px}
            bg_opa: TRANSP
            border_width: 0
            clickable: true
            on_click:
              - script.execute: tap_to_talk

api:
  actions:
    # What the bridge understood (the transcript): mis-hearings become visible.
    - action: show_heard
      variables:
        body: string
      then:
        - lvgl.label.update:
            id: caption_heard
            text: !lambda |-
              if (body.empty()) return std::string("");
              return std::string("« ") + body + " »";
    - action: show_caption
      variables:
        body: string
      then:
        - lvgl.label.update:
            id: caption_body
            text: !lambda return body;
        - lambda: id(page_hold) = true;
        - script.stop: return_to_face_later
        - if:
            condition:
              lambda: |-
                auto *page = lv_display_get_screen_active(id(ui).get_disp());
                // A pitch's announcement keeps the card it just made on screen.
                return page != id(convo_page)->obj && page != id(card_page)->obj;
            then:
              - script.execute: wake_display
              - lvgl.page.show: convo_page

# ── Screenshots over Wi-Fi: review the real pixels instead of guessing ───────
# `button.captura_de_pantalla` renders the active LVGL screen (LV_USE_SNAPSHOT,
# see the root build_flags) and streams raw little-endian RGB565 to
# ${screenshot_url} (knob_shot.h); `owy/companion/scripts/knob-shots.py` → PNGs.

# Only here so ESP-IDF's esp_http_client is compiled in for knob_shot.h.
http_request:
  id: shot_http
  verify_ssl: false

# ── DRV2605 haptics (vendor recipe: ERM open loop, library 5, I2C trigger) ─────

i2c_device:
  - id: haptics
    i2c_id: bus_a
    address: 0x5A

globals:
  - id: haptics_ok
    type: bool
    restore_value: false
    initial_value: "false"
  # The answer view's rim and mini face (the face page's live in companion.yaml).
  - id: ring_convo
    type: owy::FaceRing
    restore_value: false
  - id: mini_renderer
    type: owy::FaceRenderer
    restore_value: false

esphome:
  on_boot:
    - priority: 600
      then:
        - script.execute: haptic_init
    - priority: -100
      then:
        - lambda: |-
            id(ring_convo).create(id(convo_page)->obj, ${ring_r}, ${ring_dot});
            id(mini_renderer).scale = 96.0f / 466.0f;

interval:
  # The answer view mirrors the big face's frame: same mood, blinks and lips.
  - interval: 33ms
    then:
      - lambda: |-
          if (id(ui).is_paused()) return;
          const uint32_t now = millis();
          const bool on_convo = lv_display_get_screen_active(id(ui).get_disp()) == id(convo_page)->obj;
          const auto &frame = id(face_frame);
          id(ring_convo).apply(id(companion).ring(frame, now), on_convo && frame.ring != owy::RingMode::NONE);
          if (!on_convo) return;
          static owy::FaceObjects mini;
          if (!mini.eye_l) {
            mini.eye_l = id(mini_eye_l); mini.eye_r = id(mini_eye_r);
            mini.pupil_l = id(mini_pupil_l); mini.pupil_r = id(mini_pupil_r);
            mini.glint_l = id(mini_glint_l); mini.glint_r = id(mini_glint_r);
            mini.mouth = id(mini_mouth); mini.cavity = id(mini_cavity); mini.tongue = id(mini_tongue); mini.cut = id(mini_cut);
            mini.happy_l = id(mini_happy_l); mini.happy_r = id(mini_happy_r);
            mini.lid_l = id(mini_lid_l); mini.lid_r = id(mini_lid_r);
            mini.brow_l = id(mini_brow_l)->obj; mini.brow_r = id(mini_brow_r)->obj;
            mini.cheek_l = id(mini_cheek_l); mini.cheek_r = id(mini_cheek_r); mini.bowl = id(mini_bowl);
          }
          id(mini_renderer).render(frame, mini);
  # A driver that missed its init (bus busy at boot) gets another chance.
  - interval: 10s
    then:
      - if:
          condition:
            lambda: return !id(haptics_ok);
          then:
            - script.execute: haptic_init

number:
  - platform: template
    id: haptic_test_effect
    name: Efecto háptico de prueba
    entity_category: diagnostic
    min_value: 1
    max_value: 123
    step: 1
    initial_value: 47
    optimistic: true

button:
  - platform: template
    name: Vibración de prueba
    entity_category: diagnostic
    on_press:
      - script.execute:
          id: haptic
          effect: !lambda return int(id(haptic_test_effect).state);

# Haptic feedback rides on the shared entities: no shared file knows about the
# motor. Gestures come from the face classifier, states from the bridge's face_state.
  - platform: template
    name: Captura de pantalla
    entity_category: diagnostic
    on_press:
      - lambda: owy::post_snapshot("${screenshot_url}");

text_sensor:
  # DRV2605 STATUS (0x00): id[7:5], diag_result[3], over_temp[1], oc_detect[0].
  - platform: template
    name: Vibración
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      uint8_t status = 0;
      if (!id(haptics).read_byte(0x00, &status)) return {"DRV2605 sin respuesta"};
      char text[64];
      snprintf(text, sizeof(text), "%s · chip %u%s%s", id(haptics_ok) ? "listo" : "sin init", status >> 5,
               (status & 0x02) ? " · SOBRETEMPERATURA" : "", (status & 0x01) ? " · sobrecorriente" : "");
      return std::string(text);
  - id: !extend last_gesture
    on_value:
      - lambda: |-
          // Published once per classified contact (update_interval: never).
          int effect = 0;
          // A tap that opens the mic is confirmed by the listening buzz that
          // follows; only a tap that stops Owy gets its own.
          const auto face = id(face_state).current_option();
          if (x == "tap") effect = (face == "thinking" || face == "speaking") ? 47 : 0;
          else if (x == "pet") effect = 52;                   // pulsing strong 1 100%
          else if (x == "hold" || x == "up") effect = 12;     // triple click 100%
          else if (x == "left" || x == "right") effect = 47;  // single clicks are too subtle here
          if (effect) id(haptic).execute(effect);
  - id: !extend interface_page
    on_value:
      - lambda: |-
          static std::string previous;
          if (x == previous) return;
          previous = x;
          if (x == "card") id(haptic).execute(52);   // a proposal landed on the grid

  - platform: template
    id: power_status
    name: Power Status
    update_interval: 5s
    lambda: |-
      const float v = id(bus_voltage).state;
      if (std::isnan(v)) return {"energía: sin datos"};
      char buf[32];
      snprintf(buf, sizeof(buf), "%s%.2f V", v >= 4.6f ? "USB · " : "batería · ", v);
      return std::string(buf);

select:
  - id: !extend face_state
    on_value:
      # Template selects publish on every write: react to transitions only, or
      # the motor buzzes for the whole state.
      - lambda: |-
          static std::string previous;
          if (x == previous) return;
          previous = x;
          int effect = 0;
          if (x == "listening") effect = 10;      // double click: "te escucho"
          else if (x == "speaking") effect = 14;  // strong buzz: the reply is on screen
          else if (x == "error") effect = 15;     // 750 ms alert
          if (effect) id(haptic).execute(effect);
          // Conversation lifecycle on the mute unit: a fresh conversation clears
          // the previous exchange; when it ends, the face returns after the
          // usual 12 s so the last reply can still be read.
          static bool in_conversation = false;
          const bool active = x == "listening" || x == "thinking" || x == "speaking";
          if (active && !in_conversation) {
            in_conversation = true;
            lv_label_set_text(id(caption_body), "");
            lv_label_set_text(id(caption_heard), "");
          }
          // First mic of a conversation: say so (the bridge's transcript replaces it).
          if (x == "listening" && lv_label_get_text(id(caption_heard))[0] == 0) lv_label_set_text(id(caption_heard), "escuchando…");
          if (!active && in_conversation && (x == "idle" || x == "error" || x == "offline")) {
            in_conversation = false;
            id(page_hold) = false;
            if (lv_display_get_screen_active(id(ui).get_disp()) == id(convo_page)->obj) id(return_to_face_later).execute();
          }

switch:
  - id: !extend mic_privacy
    on_turn_on:
      - script.execute:
          id: haptic
          effect: 12
    on_turn_off:
      - script.execute:
          id: haptic
          effect: 10
  - id: !extend staff_mode
    on_turn_on:
      - script.execute:
          id: haptic
          effect: 52

sensor:
  # BATT_ADC = the 5 V rail through a 10K/10K divider (no fuel gauge on board).
  - platform: adc
    id: bus_voltage
    name: Voltaje
    entity_category: diagnostic
    pin: GPIO1
    attenuation: 12db
    update_interval: 5s
    accuracy_decimals: 2
    unit_of_measurement: V
    filters:
      - multiply: 2.0

