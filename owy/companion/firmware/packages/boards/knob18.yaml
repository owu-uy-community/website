                        border_width: 0
                        hidden: true
              - obj:
                  id: mini_cheek_l
                  align: CENTER
                  x: -32
                  y: 18
                  width: 7
                  height: 3
                  radius: 1
                  bg_color: 0xF5BB03
                  border_width: 0
                  hidden: true
