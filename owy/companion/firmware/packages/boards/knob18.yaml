# Waveshare ESP32-S3-Knob-Touch-LCD-1.8 / 1.8B (black case) hardware.
# Pins from the vendor schematic + ESP-IDF demos (2026-09). Shared ids the rest
# of the firmware binds to: bus_a · amoled · touch · screen_light · power_status.
# The PDM mic and the PCM5100A line-out stay unused: Owy hears and talks on the
# Mac. No IMU, no PMIC, no BOOT input on this board.
#
# Dual-MCU board: the USB-C reaches EITHER the ESP32-S3 (native USB-Serial/JTAG,
# /dev/cu.usbmodem*) OR the secondary ESP32-U4WDH (CH340 UART, /dev/cu.usbserial*)
# depending on plug orientation. Flip the plug until the usbmodem port appears.

i2c:
  - id: bus_a
    sda: GPIO11
    scl: GPIO12
    frequency: 400kHz
    # Expected: 0x15 CST816 touch, 0x5A DRV2605 haptics (unused).
    scan: true

# ── 1.8" 360x360 IPS LCD (ST77916 over QSPI) + CST816 capacitive touch ──────

spi:
  - id: display_qspi
    type: quad
    clk_pin: GPIO13
    data_pins:
      - GPIO15
      - GPIO16
      - GPIO17
      - GPIO18

display:
  - platform: mipi_spi
    # Shared id: face.yaml binds LVGL to it. This panel is an LCD, not AMOLED.
    id: amoled
    # ESPHome's ST77916 model; its init table is byte-identical to Waveshare's
    # demo for this panel. Pins differ from the VoCat, so they are set here.
    model: ESP-VOCAT
    spi_id: display_qspi
    cs_pin: GPIO14
    reset_pin: GPIO21
    data_rate: 40MHz
    # LVGL owns the framebuffer.
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: cst816
    id: touch
    i2c_id: bus_a
    display: amoled
    interrupt_pin: GPIO9
    reset_pin: GPIO10

# Backlight: GPIO47 → N-MOSFET → LED string. PWM above audio range.
output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO47
    frequency: 20000Hz

light:
  - platform: monochromatic
    id: screen_light
    name: Pantalla
    output: backlight_pwm
    default_transition_length: 0s
    restore_mode: ALWAYS_ON
    initial_state:
      brightness: 80%

# ── The knob: a bidirectional detent SWITCH, not a quadrature encoder ─────────
#
# Waveshare's own driver (bidi_switch_knob.c) treats the two lines as two
# momentary contacts: one detent clockwise pulses A (GPIO8), one detent
# anticlockwise pulses B (GPIO7). A quadrature decoder never sees a full cycle
# here, so the knob is read as two debounced buttons. Turning adjusts screen
# brightness, shows a ring overlay and ticks the haptics.

binary_sensor:
  - platform: gpio
    id: knob_cw
    internal: true
    pin:
      number: GPIO8
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 5ms
      - delayed_off: 10ms
    on_press:
      - script.execute:
          id: knob_turn
          delta: 1
  - platform: gpio
    id: knob_ccw
    internal: true
    pin:
      number: GPIO7
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 5ms
      - delayed_off: 10ms
    on_press:
      - script.execute:
          id: knob_turn
          delta: -1

script:
  - id: knob_turn
    mode: queued
    parameters:
      delta: int
    then:
      # The switch lines can read "pressed" while the inputs settle at boot.
      - if:
          condition:
            lambda: return millis() < 3000;
          then:
            - script.stop: knob_turn
      - script.execute: wake_display
      # On ajustes the knob scrolls a row of tiles; on help it turns the page.
      - if:
          condition:
            lambda: return lv_display_get_screen_active(id(ui).get_disp()) == id(quick_page)->obj;
          then:
            - lambda: lv_obj_scroll_by(id(quick_list), 0, -${row_step} * delta, LV_ANIM_ON);
            - script.execute:
                id: haptic
                effect: 24
            - script.stop: knob_turn
      - if:
          condition:
            lambda: return lv_display_get_screen_active(id(ui).get_disp()) == id(help_page)->obj;
          then:
            - lambda: lv_obj_scroll_by(id(help_cards), -${help_w} * delta, 0, LV_ANIM_ON);
            - script.execute:
                id: haptic
                effect: 24
            - script.stop: knob_turn
      - number.set:
          id: screen_brightness
          value: !lambda |-
            const float v = id(screen_brightness).state + 5.0f * delta;
            return v < 10 ? 10 : v > 100 ? 100 : v;
      # Brightness on the rim, the same language as the listening halo.
      - lambda: |-
          id(overlay_level) = (id(screen_brightness).state - 10) / 90.0f;
          id(overlay_until) = millis() + 1200;
          char text[24];
          snprintf(text, sizeof(text), "brillo %d%%", int(id(screen_brightness).state));
          lv_label_set_text(id(overlay_label), text);
      - script.execute:
          id: haptic
          effect: !lambda |-
            const float v = id(screen_brightness).state;
            return (v <= 10 || v >= 100) ? 47 : 24;  // buzz at the ends, tick per detent

  # DRV2605 playback: waveform slot 1 = effect, slot 2 = end, GO. Coin ERM in
  # open loop: single ticks are barely perceptible, so the hooks use buzzes.
  - id: haptic
    mode: queued
    parameters:
      effect: int
    then:
      - lambda: |-
          if (!id(haptics_ok)) return;
          // Two cues within 150 ms blur into one long rumble: keep the first.
          static uint32_t last = 0;
          const uint32_t now = millis();
          if (last && now - last < 150) return;
          last = now;
          id(haptics).write_byte(0x04, uint8_t(effect));
          id(haptics).write_byte(0x05, 0);
          id(haptics).write_byte(0x0C, 1);

  - id: haptic_init
    mode: single
    then:
        - lambda: |-
            uint8_t status = 0;
            if (!id(haptics).read_byte(0x00, &status)) {
              ESP_LOGW("owy.haptics", "DRV2605 no responde en 0x5A; sin vibración");
              return;
            }
            auto *drv = id(haptics);  // ESPHome rewrites `id(x).` → `x->`; keep the pointer explicit
            drv->write_byte(0x01, 0x00);  // MODE: out of standby, internal (I2C) trigger
            drv->write_byte(0x02, 0x00);  // no real-time playback
            drv->write_byte(0x0D, 0x00);  // overdrive / sustain / brake offsets
            drv->write_byte(0x0E, 0x00);
            drv->write_byte(0x0F, 0x00);
            drv->write_byte(0x10, 0x00);
            drv->write_byte(0x13, 0x64);  // audio-to-vibe max (vendor default)
            uint8_t reg = 0;
            drv->read_byte(0x1A, &reg);
            drv->write_byte(0x1A, reg & 0x7F);  // FEEDBACK: ERM
            drv->read_byte(0x1D, &reg);
            drv->write_byte(0x1D, reg | 0x20);  // CONTROL3: ERM open loop
            drv->write_byte(0x03, 5);           // waveform library 5
            id(haptics_ok) = true;
            ESP_LOGI("owy.haptics", "DRV2605 listo (status 0x%02X, chip id %u)", status, status >> 5);

# Tuning without reflashing: pick an effect id (DRV2605 ROM library, 1–123),
# press the test button, feel. Then bake the winners into the hooks below.

lvgl:
  pages:
# ── Answer view (Owy's voice plays on the Mac; the words show here) ────────────
#
# The face stays up while there is no answer (listening/thinking happen on it).
# The first caption of a reply brings this page up and pins it (`page_hold`),
# released when the conversation ends (the face returns 12 s later). A mini Owy
# that keeps lip-syncing (the same Frame and the same parts as the big face,
# rendered at 96 px), what Owy heard in a grey pill (`show_heard`), the reply
# (bottom-anchored so long answers keep their newest lines) and the shared rim.
# Tap = talk again.
    - id: convo_page
      bg_color: 0x000000
      widgets:
        - obj:
            id: mini_face
            align: TOP_MID
            y: 12
            width: 96
            height: 96
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
            # The big face's whole tree at 96/466 (brows, lids, happy cuts, cheeks,
            # bowl): the renderer sizes and places every part each frame, so the
            # answer view's Owy makes the very same faces.
            widgets:
              - line:
                  id: mini_brow_l
                  align: CENTER
                  x: -19
                  y: -31
                  points:
                    - 2, 5
                    - 11, 5
                  line_width: 2
                  line_color: 0xF5BB03
                  line_rounded: true
              - line:
                  id: mini_brow_r
                  align: CENTER
                  x: 19
                  y: -31
                  points:
                    - 2, 5
                    - 11, 5
                  line_width: 2
                  line_color: 0x0162C8
                  line_rounded: true
              - obj:
                  id: mini_eye_l
                  align: CENTER
                  x: -18
                  y: -5
                  width: 31
                  height: 32
                  radius: 12
                  bg_color: 0xFBF5E7
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  widgets:
                    - obj:
                        id: mini_pupil_l
                        align: CENTER
                        width: 9
                        height: 11
                        radius: 4
                        bg_color: 0x000000
                        border_width: 0
                        pad_all: 0
                        scrollable: false
                        widgets:
                          - obj:
                              id: mini_glint_l
                              align: CENTER
                              width: 3
                              height: 3
                              radius: 2
                              bg_color: 0xFBF5E7
                              border_width: 0
                    - obj:
                        id: mini_happy_l
                        align: CENTER
                        y: 29
                        width: 26
                        height: 26
                        radius: 13
                        bg_color: 0x000000
                        border_width: 0
                        hidden: true
              - obj:
                  id: mini_eye_r
                  align: CENTER
                  x: 18
                  y: -5
                  width: 31
                  height: 32
                  radius: 12
                  bg_color: 0xFBF5E7
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  widgets:
                    - obj:
                        id: mini_pupil_r
                        align: CENTER
                        width: 9
                        height: 11
                        radius: 4
                        bg_color: 0x000000
                        border_width: 0
                        pad_all: 0
                        scrollable: false
                        widgets:
                          - obj:
                              id: mini_glint_r
                              align: CENTER
                              width: 3
                              height: 3
                              radius: 2
                              bg_color: 0xFBF5E7
                              border_width: 0
                    - obj:
                        id: mini_happy_r
                        align: CENTER
                        y: 29
                        width: 26
                        height: 26
                        radius: 13
                        bg_color: 0x000000
                        border_width: 0
                        hidden: true
              - obj:
                  id: mini_lid_l
                  align: CENTER
                  x: -18
                  y: -21
                  width: 32
                  height: 2
                  radius: 1
                  bg_color: 0x000000
                  border_width: 0
                  hidden: true
              - obj:
                  id: mini_lid_r
                  align: CENTER
                  x: 18
                  y: -21
                  width: 32
                  height: 2
                  radius: 1
                  bg_color: 0x000000
                  border_width: 0
                  hidden: true
              - obj:
                  id: mini_mouth
                  align: CENTER
                  y: 24
                  width: 21
                  height: 6
                  radius: 4
                  bg_color: 0xFBF5E7
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  widgets:
                    - obj:
                        id: mini_cavity
                        align: CENTER
                        width: 12
                        height: 2
                        radius: 1
                        bg_color: 0x000000
                        border_width: 0
                        pad_all: 0
                        scrollable: false
                        hidden: true
                        widgets:
                          - obj:
                              id: mini_tongue
                              align: CENTER
                              width: 6
                              height: 2
                              radius: 4
                              bg_color: 0xF5BB03
                              border_width: 0
                              hidden: true
                    - obj:
                        id: mini_cut
                        align: CENTER
                        width: 17
                        height: 5
                        radius: 3
                        bg_color: 0x000000
                        border_width: 0
